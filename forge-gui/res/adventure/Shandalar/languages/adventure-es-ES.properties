adv.main_story_castles_blue_castle.55.d.n1.text=De repente, la verja desaparece justo ante tus ojos. Ya puedes pasar libremente.
adv.main_story_castles_blue_castle.55.d.n2.name=¡Lorthos, he hecho lo que me pediste! ¡Es hora de acabar con esto!
