adv.main_story_castles_blue_castle.85.d.n9.text=Estoy impresionado, eres bienvenido para reunirte con mi amo en el piso de arriba, aunque no puedo garantizar que sobrevivas a ese encuentro.
adv.main_story_castles_blue_castle_f1.50.x.n0.text=Al asestar tu golpe final contra Lorthos, sientes un pulso de maná considerable. Pero, eliminada la amenaza inmediata, ahora puedes ver claramente que la sala cerrada al norte de la cámara no contiene ningún prisionero.
adv.main_story_castles_blue_castle_f1.50.x.n2.text=Al asestar tu golpe final contra Lorthos, sientes otro pulso de maná. Pero, como antes, la sala cerrada tras tu enemigo caído no contiene ningún prisionero.
adv.main_story_castles_green_castle.55.d.n0.text=Llegas ante una verja.
adv.main_story_castles_green_castle.55.d.n1.text=Con un rugido ensordecedor, la verja estalla dejando solo cenizas a tu paso. Ya puedes pasar libremente.
adv.main_story_castles_green_castle.55.d.n2.name=¡Ghalta, he hecho lo que me pediste! ¡Es hora de acabar con esto!
