adv.skep_skep_outer.100.d.n0.text=¡Buen día, aventurero!
adv.skep_skep_outer.101.d.n0.text=Buen día, aventurero. Como puedes ver, tenemos una buena situación entre manos.
adv.skep_skep_outer.101.d.n1.text=Por razones desconocidas, las Astillas del Panal se han vuelto hostiles y han estado lanzando partidas de saqueo contra varios pueblos de Shandalar. El general Jarkhald ha reunido una gran hueste para lidiar con la situación.
adv.skep_skep_outer.101.d.n10.text=Esas cosas siguen merodeando más allá de las murallas, deduzco que aún no te has ocupado del asunto, ¿verdad?
adv.skep_skep_outer.101.d.n12.text=¡No pensé que realmente lo lograrías! Tal como prometí, te daré el objeto del que hablé antes. Gracias, aventurero. ¡MUCHACHOS, escuchad! ¡Nuestro trabajo aquí ha terminado, el líder de esas cosas está muerto! Salgamos de este sitio espeluznante. ¡La cerveza corre de mi cuenta!
adv.skep_skep_outer.101.d.n13.name=Las Astillas ya no serán un problema.
adv.skep_skep_outer.101.d.n2.name=¿Qué está pasando por aquí?
adv.skep_skep_outer.101.d.n3.text=Bueno, lo intentamos antes, pero debido a la enorme cantidad de Astillas no hemos avanzado mucho más allá de amurallar la colmena para evitar más ataques contra los aldeanos de los alrededores.
adv.skep_skep_outer.101.d.n4.name=¿Así que pretendéis simplemente asaltar la colmena y esperar lo mejor?
adv.skep_skep_outer.101.d.n5.text=Las Astillas forman una mente colmena, lo que significa que si su reina fuera neutralizada de alguna forma, las Astillas ya no serían un problema. Por desgracia, no tenemos un voluntario valiente dispuesto a entrar en la colmena y encargarse de la reina...
adv.skep_skep_outer.101.d.n6.name=¿De alguna forma podría servir de ayuda contra las Astillas?
adv.skep_skep_outer.101.d.n7.text=Aparte del agradecimiento del pueblo de Shandalar por lidiar con estas criaturas horribles, te daré una pieza de armadura nueva y elegante que te ayudará en tus próximas aventuras. Encárgate de la reina y vuelve a verme para recibir tu recompensa. Haré que mis hombres abran la verja para dejarte entrar en la colmena. ¡Buena suerte, aventurero!
adv.skep_skep_outer.101.d.n8.name=Puedo encargarme de la reina, pero ¿qué gano yo con esto?
adv.skep_skep_outer.101.d.n9.name=Fin
adv.skep_skep_outer.150.d.n0.text=¡Buen día, aventurero!
adv.skep_skep_outer.151.d.n0.text=¡Buen día, aventurero!
adv.skep_skep_outer.238.d.n0.text=Esas cosas no pasarán de esta verja. Puedes contar con ello, aventurero.
adv.skep_skep_outer.239.d.n0.text=¡Buen día, aventurero!
adv.skep_skep_outer.240.d.n0.text=¡Buen día, aventurero!
adv.skep_skep_outer.241.d.n0.text=¡Buen día, aventurero!
adv.skep_skep_outer.242.d.n0.text=Esta verja está cerrada con llave.
adv.skep_skep_outer.242.d.n2.text=La verja se ha abierto.
adv.skep_skep_outer.242.d.n3.name=Abrir con la Llave de la Verja Exterior
adv.skep_skep_outer.250.d.n0.text=El caballo te mira con desinterés.
adv.skep_skep_outer.256.d.n0.text=Un campo rojo translúcido y reluciente bloquea tu camino. Extraños sonidos resuenan en la sala a tus espaldas.
adv.skep_skep_outer.256.d.n2.name=El campo rojo se disuelve ante tus ojos. Puedes seguir adelante.
adv.skep_skep_outer.266.d.n0.text=Muchas bocas que alimentar, poco tiempo para charlar.
adv.skep_skep_outer.266.d.n2.text=¿Adónde ha ido toda esa gente elegante? ¿Alguien ha dicho cerveza gratis?
adv.skep_skep_outer.57.d.n0.text=La Astilla Herida te observa con interés
adv.skep_skep_outer.57.d.n1.text=Soy la reina de las Astillas del Panal. Al menos lo era, hasta que usurparon mi posición.
adv.skep_skep_outer.57.d.n10.name=Considéralo hecho.
adv.skep_skep_outer.57.d.n11.text=Débil... estoy. Derrota a la Reina de las Astillas... antes de que pierda mis últimas fuerzas.
adv.skep_skep_outer.57.d.n13.text=Mi... mi gratitud hacia ti, forastero. Siento que mis fuerzas van volviendo poco a poco. Tal como prometí, retomaré el control de las Astillas como su reina. El pueblo de Shandalar ya no debería temer a las Astillas del Panal. Aunque ten cuidado, aventurero, mis hijos seguirán defendiéndose de cualquier intruso que entre en el Panal. ¡Adiós, aventurero!
adv.skep_skep_outer.57.d.n14.name=¡La Reina de las Astillas ha sido derrotada!
adv.skep_skep_outer.57.d.n2.name=¿Qué eres?
adv.skep_skep_outer.57.d.n3.text=Durante milenios he mantenido a las Astillas del Panal sanas y en paz, controlándolas para evitar que atacaran a los forasteros. Todo cambió cuando la Reina de las Astillas atacó y tomó el control de esta colmena. Como puedes ver, no fui capaz de derrotarla.
adv.skep_skep_outer.57.d.n4.name=¿Usurpada? ¿De qué hablas?
adv.skep_skep_outer.57.d.n5.text=Exacto, ha estado reuniendo una poderosa hueste de Astillas de todo el multiverso. Pronto tendrá un ejército lo bastante grande para conquistar todo Shandalar.
adv.skep_skep_outer.57.d.n6.name=Supongo que la Reina de las Astillas es la razón por la que las Astillas del Panal están tan agresivas, ¿verdad?
adv.skep_skep_outer.57.d.n7.text=Aprecio tu entusiasmo, sin embargo la reina no es un oponente al que enfrentarse a la ligera. En primer lugar, para acceder a su guarida necesitas derrotar a tres de sus lugartenientes, repartidos por el Panal. Solo entonces desaparecerá el escudo mágico y podrás entrar en su guarida.
adv.skep_skep_outer.57.d.n8.name=¿Dónde está ubicada? Yo me encargaré de ello.
adv.skep_skep_outer.57.d.n9.text=Una vez que te hayas encargado de la reina, vuelve conmigo. Cuando sea reinstaurada como reina colmena de las Astillas de Shandalar, te prometo que las Astillas del Panal nunca volverán a ser un peligro para el pueblo de Shandalar. Además, toma esta Piedra Colmena, permitirá que tus criaturas se conviertan en Astillas, causando confusión en la Reina de las Astillas.
adv.skep_skep_outer.73.d.n0.text=Muchas bocas que alimentar, poco tiempo para charlar.
adv.skep_skep_outer.74.d.n0.text=La inscripción dice: Forastero, dile a nuestros hermanos que aquí yacemos, fieles hasta el final a nuestra lucha contra la amenaza esquirla.
adv.skep_skep_outer.93.d.n0.text=¡Buenas, aventurero!
adv.skep_skep_outer.99.d.n0.text=¡Buen día, aventurero!
adv.snowabbey_snowabbey_1.78.d.n0.text=La inscripción dice: Bienvenido a la aldea pesquera de Haran
adv.tibalt_tibalt_f0.189.d.n0.text=Al acercarte, las puertas del castillo se abren con un chirrido inquietante, revelando un patio en penumbra envuelto en un silencio perturbador. El suelo bajo tus pies se siente frío e implacable, como si la propia tierra retrocediera ante la presencia del dominio de Tibalt. Gárgolas siniestras te observan desde los muros del castillo, sus formas grotescas pareciendo cobrar vida con la luz menguante.
adv.tibalt_tibalt_f1.136.x.n0.text=El Diablo lanza un grito agudo al caer al suelo. Su sangre se mezcla con la de sus víctimas, y ves cómo la barrera roja desaparece. El camino hacia arriba está abierto.
adv.tibalt_tibalt_f1.217.d.n0.text=Un campo rojo translúcido y reluciente bloquea tu camino. Un mal ancestral acecha en estas criptas, impidiéndote entrar en la sala que tienes delante...
adv.tibalt_tibalt_f2.119.x.n0.text=El Cíclope lanza un grito agudo al caer al suelo. Su sangre se mezcla con la de sus víctimas, y ves cómo la barrera roja desaparece. El camino hacia Tibalt está abierto.
adv.tibalt_tibalt_f2.200.d.n0.text=Un campo rojo translúcido y reluciente bloquea tu camino. Un mal ancestral acecha en estas criptas, impidiéndote entrar en la sala frente a ti...
adv.tibalt_tibalt_f3.119.x.n0.text=El Torturador lanza un grito agudo al caer al suelo. Su sangre se mezcla con la de sus víctimas torturadas, y ves cómo la barrera roja desaparece. El camino hacia las cámaras de Tibalt está abierto.
adv.tibalt_tibalt_f3.201.d.n0.text=Un campo rojo translúcido y reluciente bloquea tu camino. Un mal ancestral acecha en estas criptas, impidiéndote entrar en la sala frente a ti...
adv.tibalt_tibalt_f3.204.d.n0.text=Esta puerta está cerrada con llave.
adv.tibalt_tibalt_f3.204.d.n2.text=La verja se ha abierto, aunque la llave se rompe al abrir la puerta.
adv.tibalt_tibalt_f3.204.d.n3.name=Abrir con la llave del Torturador
adv.tibalt_tibalt_f4.168.d.n0.text=Esta puerta está cerrada con llave.
adv.tibalt_tibalt_f4.168.d.n2.text=La verja se ha abierto.
adv.tibalt_tibalt_f4.168.d.n3.name=Abrir con la Llave de Tibalt
adv.tibalt_tibalt_f4.176.d.n0.text=Una melodía baja e inquietante suena de fondo, procedente de fuentes invisibles. El sonido parece resonar desde las propias paredes, creando un ambiente perturbador que aumenta la sensación de fatalidad. Artefactos extraños y reliquias arcanas están esparcidos por toda la cámara, testimonio del dominio de Tibalt sobre la magia oscura.
adv.towns_plains_town.53.d.n0.text=Soy una gran verja. Saludos.
adv.towns_plains_town.53.d.n1.name=Vale...
adv.vampirecastle_vampirecastle_4.82.d.n0.text=Una gran verja bloquea el paso. A través de los barrotes puedes ver una figura imponente en la sala más allá.
adv.vampirecastle_vampirecastle_4.82.d.n2.text=La verja se ha abierto.
adv.vampirecastle_vampirecastle_4.82.d.n3.name=Abrir con la llave
adv.vampirecastle_vampirecastle_4.98.d.n0.text=El pobre campesino se encoge de miedo ante ti.
adv.vampirecastle_vampirecastle_4.98.d.n1.text=Gracias... Gracias, señor, por favor acepte esto como muestra de mi gratitud.
adv.vampirecastle_vampirecastle_4.98.d.n2.name=Eres libre de irte, Sorin ha sido derrotado.
adv.vampirecastle_vampirecastle_4.98.d.n3.name=(Coger la Moneda del Desafío)
adv.vampirecastle_vampirecastle_grave_1.62.d.n0.text=Ves un ataúd tendido en el centro de la cripta. Esta reliquia de la historia vampírica, en su día un vaso para los no-muertos, permanece ahora como un testimonio desgastado por el paso del tiempo, testigo silencioso de los secretos y sombras que se han desarrollado entre sus confines. El antiguo ataúd, depositario de siglos, desprende un aura tanto de amenaza como de melancolía, centinela silencioso de los misterios del reino nocturno.
adv.vampirecastle_vampirecastle_grave_1.62.d.n2.text=Sientes una cantidad inmensa de poder irradiando del ataúd. También empiezas a notar los diversos símbolos impíos grabados en la base del ataúd.
adv.vampirecastle_vampirecastle_grave_1.62.d.n3.name=Examinar de cerca el ataúd oxidado
adv.vampirecastle_vampirecastle_grave_1.62.d.n5.text=Al abrir el ataúd, una figura poderosa despierta entre las sombras. Grita con voz ancestral: ¿TE ATREVES A DESPERTARME, PATÉTICO MORTAL?
adv.vampirecastle_vampirecastle_grave_1.62.d.n6.name=Abrir el ataúd
adv.vampirecastle_vampirecastle_grave_1.63.d.n0.text=Un campo rojo translúcido y reluciente bloquea tu camino. Un mal ancestral acecha en estas criptas, impidiéndote entrar en la sala frente a ti...
