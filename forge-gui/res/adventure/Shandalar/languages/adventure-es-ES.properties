adv.main_story_temple_of_gideon_town.266.d.n0.text=Tras esta verja, ves a la legendaria Liliana. Parece estar sumida en algún tipo de ritual. Pero para llegar hasta ella, primero necesitas encontrar al alcalde.
adv.main_story_temple_of_gideon_town.282.d.n0.text=El ritual de Liliana parece estar cerca de completarse. Ves un portal al otro lado de ella que conduce fuera de su dominio.
adv.main_story_temple_of_gideon_town.282.d.n1.text=Al abrir la verja, ella alcanza el clímax de sus conjuros, y los montones de cadáveres a ambos lados del portal empiezan a levantarse. ¡Debes detenerla antes de que esta horda de no-muertos sea liberada sobre Shandalar!
adv.main_story_temple_of_liliana_bog.240.d.n0.text=Una vieja bruja te observa con recelo, pero no levanta su bastón para atacar.
