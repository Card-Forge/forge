adv.main_story_castles_green_castle.72.d.n7.text=Los retadores siguen con vida, no podrás pasar de esta verja.
adv.main_story_castles_green_castle.72.d.n9.text=Estoy impresionada, eres bienvenido para reunirte con mi ama en el piso de arriba, aunque no puedo garantizar que sobrevivas a ese encuentro. Adiós, aventurero
adv.main_story_castles_green_castle_f1.52.x.n0.text=Al asestar tu golpe final contra Ghalta, sientes un pulso de maná considerable.
