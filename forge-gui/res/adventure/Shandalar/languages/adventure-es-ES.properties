adv.main_story_castles_blue_castle.85.d.n1.text=Me temo que no tengo permitido hacer eso, soy un mero sirviente del poderoso Lorthos, amo de las profundidades del mar.
adv.main_story_castles_blue_castle.85.d.n2.name=¿Ah, sí? Supongo que no te importará abrir esa verja delante de mí, ¿verdad?
adv.main_story_castles_blue_castle.85.d.n3.text=Debes demostrar tu fuerza derrotando al menos a cuatro de los cinco enemigos que acechan en esta mazmorra para ser digno de una audiencia con mi ilustre amo.\n Afila tu espada, prepara tus hechizos y reúne valor, pues los desafíos que te esperan pondrán a prueba el temple incluso del guerrero más curtido.
