adv.main_story_temple_of_liliana_town.237.d.n0.text=En el extremo norte del cenagal encuentras un pequeño asentamiento de composición inusual. Incluso en lo más profundo de las tierras pantanosas, es raro ver a tantos habitantes de la noche y practicantes de artes impías reunidos en un solo lugar.
adv.main_story_temple_of_liliana_town.237.d.n1.text=Ante ti ves a un mago de aspecto bastante regio con una gran llave colgando de su cinturón. Parece que identificar al alcalde va a ser fácil. Sin embargo, suelta un grito ahogado al reconocerte y, evidentemente, no tiene ningún interés en quedarse a charlar contigo.
adv.main_story_temple_of_liliana_town.237.d.n3.text=El alcalde desaparece en una nube de humo negro, pero tienes la certeza de que sigue en algún lugar de la zona. Solo es cuestión de encontrarlo.
