adv.main_story_temple_of_liliana_forest.270.d.n0.text=Una gran verja se alza entre tú y la zona al norte. Sobre la verja hay una inscripción que dice "NO ABRIR MUERTOS DENTRO".
adv.main_story_temple_of_liliana_forest.270.d.n1.text=La verja está cerrada con un candado grande y elaborado.
adv.main_story_temple_of_liliana_forest.270.d.n2.name=Abrir la verja
adv.main_story_temple_of_liliana_forest.270.d.n3.name=Alejarse en busca de una llave
