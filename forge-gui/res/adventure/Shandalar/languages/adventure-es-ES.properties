adv.grove_grove_1_bears.86.d.n0.text=De repente oyes ruidos extraños detrás de ti. Una voz áspera truena a tu espalda: ¡MINA DE MIEL, MORIRÁS!
adv.grove_grove_1_bears.86.d.n1.name=Tienes un mal presentimiento sobre esto.
adv.grove_grove_8_hydra.114.d.n0.text=¡Bestia peligrosa por delante! ¡Da media vuelta ahora mismo!
adv.magetower_magetower_14_horrors.102.d.n0.text=Una verja bloquea el paso. Parece que se abre desde otro lugar.
adv.magetower_magetower_8_illusion.105.d.n0.text=Esta puerta está cerrada con llave. A juzgar por los arañazos y marcas en el suelo, sin embargo, parece abrirse con frecuencia, así que la llave probablemente se encuentre cerca.
adv.magetower_magetower_8_illusion.105.d.n1.name=(Marcharse)
adv.magetower_magetower_8_illusion.105.d.n2.text=La puerta se abre y puedes continuar explorando la torre.
adv.magetower_magetower_8_illusion.105.d.n3.name=Abrir la verja con la llave del Ilusionista
adv.magetower_wastetown.102.d.n0.text=Una verja bloquea el paso. Parece que se abre desde otro lugar.
adv.main_story_castles_black_castle.55.d.n0.text=Llegas ante la verja.
adv.main_story_castles_black_castle.55.d.n1.text=Con una ráfaga de viento negro, la puerta se hace pedazos. Ya puedes pasar libremente.
adv.main_story_castles_black_castle.55.d.n2.name=¡Griselbrand, he hecho lo que me pediste! ¡Es hora de acabar con esto!
adv.main_story_castles_black_castle.55.d.n4.text=Con una ráfaga de viento negro, la puerta se hace pedazos. Ya puedes pasar libremente.
adv.main_story_castles_black_castle.55.d.n5.name=¡Griselbrand, he hecho lo que me pediste! ¡Es hora de acabar con esto!
adv.main_story_castles_black_castle.55.d.n7.text=NO ERES DIGNO, ¡LÁRGATE!
adv.main_story_castles_black_castle.55.d.n8.name=Llamas a la puerta.
adv.main_story_castles_black_castle.73.d.n0.text=Bienvenido, '{'var=player_name'}'. Griselbrand ha estado esperando con ansia este momento.
adv.main_story_castles_black_castle.73.d.n1.text=Me temo que no tengo permitido hacer eso, solo soy un humilde sirviente del poderoso Griselbrand, amo de los Demonios.
adv.main_story_castles_black_castle.73.d.n2.name=¿Ah, sí? Supongo que no te importará abrir esa verja delante de mí.
adv.main_story_castles_black_castle.73.d.n3.text=Debes demostrar tu fuerza derrotando al menos a cuatro de los cinco enemigos que acechan en esta mazmorra para ser digno de una audiencia con mi ilustre amo.\n Afila tu hoja, prepara tus hechizos y reúne valor, pues los desafíos que se avecinan pondrán a prueba el temple incluso del guerrero más curtido.
adv.main_story_castles_black_castle.73.d.n4.name=¿Qué tengo que hacer para pasar por esta verja?
adv.main_story_castles_black_castle.73.d.n6.name=Demostraré mi valía, solo asegúrate de abrir la verja cuando derrote a tus retadores.
adv.main_story_castles_black_castle.73.d.n7.text=Los retadores siguen con vida, no podrás pasar de esta verja
adv.main_story_castles_black_castle.73.d.n9.text=Estoy impresionado, eres bienvenido a reunirte con mi amo arriba, aunque no puedo garantizar que sobrevivas a ese encuentro.
adv.main_story_castles_black_castle_f1.50.x.n0.text=Al asestar tu golpe final contra Griselbrand, sientes un pulso de maná considerable.
adv.main_story_castles_black_castle_f1.50.x.n2.text=Al asestar tu golpe final contra Griselbrand, sientes otro pulso de maná.
