adv.main_story_temple_of_liliana_town.224.d.n0.text=El alcalde solo puede mantenerse alejado de ti un tiempo limitado, antes de que consigas abrirte paso entre la multitud y alcanzarlo.
adv.main_story_temple_of_liliana_town.224.d.n2.name=Atacar al Alcalde
adv.main_story_temple_of_liliana_town.224.x.n0.text=Arrancas la llave de las manos frías y muertas (y vueltas a morir) del alcalde. Ahora que la tienes, poco te separa ya de Liliana.
