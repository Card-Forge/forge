adv.item_sir_donovans_amulet.n0.text=El amuleto permanece inerte hasta que se canaliza maná a través de él.
adv.item_sir_donovans_amulet.n1.name=Guardar el amuleto
adv.item_sir_donovans_amulet.n2.name=Contactar con Sir Donovan (Requiere 3 Fragmentos de Maná)
adv.item_sir_donovans_amulet.n2.text=Sin saber muy bien qué esperar, canalizas algo de energía de tus propios fragmentos de maná hacia el amuleto. Este brilla con una sucesión de colores durante un brevísimo instante, y luego se apaga.
adv.item_sir_donovans_amulet.n3.text=Un pensamiento entra en tu mente en respuesta, no tanto palabras como un impulso: deberías ir a un pueblo.
adv.item_sir_donovans_amulet.n4.name=Contactar con Sir Donovan (Requiere 5 Fragmentos de Maná)
adv.item_sir_donovans_amulet.n4.text=Canalizas el poder de tus fragmentos de maná hacia el artefacto. Esta vez hace falta usar unos cuantos más antes de que el dispositivo reaccione, pero finalmente vuelve a brillar en múltiples colores.
adv.item_landscape_sketchbook.n0.text=Encontraste este cuaderno de bocetos en el yacimiento.
adv.item_landscape_sketchbook.n1.name=No consigues sacar mucho en claro de los bocetos del interior, pero será mejor que lo conserves...

