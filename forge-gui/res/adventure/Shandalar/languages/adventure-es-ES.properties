adv.main_story_temple_of_liliana_town.266.d.n0.text=Tras esta verja, ves a la legendaria Liliana. Parece estar sumida en algún tipo de ritual. Pero para llegar hasta ella, primero necesitas encontrar al alcalde.
adv.main_story_temple_of_liliana_town.282.d.n0.text=El ritual de Liliana parece estar cerca de completarse. Ves un portal al otro lado de ella que conduce fuera de su dominio.
adv.main_story_temple_of_liliana_town.282.d.n1.text=Al abrir la verja, ella alcanza el clímax de sus conjuros, y los montones de cadáveres a ambos lados del portal empiezan a levantarse. ¡Debes detenerla antes de que esta horda de no-muertos sea liberada sobre Shandalar!
adv.main_story_templeofchandra.1.d.n0.text=Esta ominosa verja negra se alza entre tú y tu objetivo y/o tu perdición. Engranajes bien engrasados la mantienen cerrada.
adv.main_story_templeofchandra.10.d.n0.text=Una gran palanca está empotrada en la pared. O lo estaba. Parece haberse fundido, lo que habría requerido un calor enorme.
adv.main_story_templeofchandra.11.d.n0.text=Esta verja parece estar conectada a la maquinaria al oeste.
adv.main_story_templeofchandra.11.d.n1.name=Ahora, a encontrar la forma de encenderlo...
adv.main_story_templeofchandra.16.d.n0.text=Una gran palanca está empotrada en la pared. O lo estaba. Parece haberse fundido, lo que habría requerido un calor enorme.
adv.main_story_templeofchandra.17.d.n0.text=Esta verja parece estar bloqueada por algún mecanismo, pero no ves ningún control por aquí.
adv.main_story_templeofchandra.17.d.n1.name=¡Es hora de encontrarlas!
adv.main_story_templeofchandra.18.d.n0.text=Esta verja parece estar bloqueada por algún mecanismo, pero no ves ningún control por aquí.
adv.main_story_templeofchandra.18.d.n1.name=Es hora de encontrarlas. Otra vez...
adv.maze_maze_2.49.x.n0.text=Tu oponente lanza un grito agudo mientras vuelve a su forma de piedra, pero ya no está equilibrado sobre un pedestal. La estatua cae y se hace añicos, y muchos de los fragmentos caen al estanque. Casi juraríais que se puede oír el grito continuar débilmente bajo la superficie del agua.
adv.maze_maze_2.58.d.n0.text=De repente oyes extraños sonidos a tu espalda. Una voz extraña grita con voz ronca: ¡INTRUSO! ¡Este es tu último error!
adv.maze_maze_2.58.d.n1.name=Tienes un mal presentimiento sobre esto.
adv.minibosses_slime_hive.137.d.n0.text=La inscripción dice: El sistema de alcantarillado de Shandalar está en mantenimiento. Un poco de baba verde ha contaminado la red de agua. Lo tenemos totalmente bajo control y el alcantarillado volverá a funcionar enseguida.
adv.minibosses_wastetown.137.d.n0.text=La inscripción dice: El sistema de alcantarillado de Shandalar está en mantenimiento. Un poco de baba verde ha contaminado la red de agua. Lo tenemos totalmente bajo control y el alcantarillado volverá a funcionar enseguida.
adv.monastery_unhallowed_abbey_1F.85.d.n0.text=Esta puerta está cerrada con llave.
adv.monastery_unhallowed_abbey_1F.85.d.n2.text=La verja se ha abierto.
adv.monastery_unhallowed_abbey_1F.85.d.n3.name=Abrir con la Llave del Cultista
adv.monastery_unhallowed_abbey_2F.113.d.n0.text=*El demonio grande e imponente ante ti sonríe con suficiencia*\n Ah, así que tú eres quien ha estado liberando a mis sacrificios... y el voluntario para ser el siguiente. Dime, mortal, como últimas palabras que no sean un aullido de dolor: ¿por qué me desafías?
adv.monastery_unhallowed_abbey_2F.113.d.n1.text=*El demonio sonríe con desdén.*\n Ah, un noble *héroe*. Debí suponerlo. Los de tu calaña mueren como cualquier otro cuando se les agota el poder... ¡permíteme demostrártelo!
adv.monastery_unhallowed_abbey_2F.113.d.n10.text=*Los ojos del demonio se entrecierran.*\n ¿Demasiado asustado para hablar? Que así sea, mortal. Morirás igualmente.
adv.monastery_unhallowed_abbey_2F.113.d.n11.name=...
adv.monastery_unhallowed_abbey_2F.113.d.n2.name=¡Porque eres un monstruo, y hay que detenerte!
adv.monastery_unhallowed_abbey_2F.113.d.n4.text=*El demonio se ríe entre dientes.*\n Elogio tu ambición, si no tu sensatez. Lucha con suficiente fuerza y quizás te deje reemplazar ese fracaso con el que lidiaste arriba.
adv.monastery_unhallowed_abbey_2F.113.d.n5.name=Quiero poder. Lo tomaré de lo que quede de ti.
adv.monastery_unhallowed_abbey_2F.113.d.n7.text=*El demonio parpadea sorprendido, luego ríe.*\n Bueno, si eso es lo que buscas, aquí encontrarás más de lo que esperabas. Espero que disfrutes de la última batalla de tu vida, *mortal*.
adv.monastery_unhallowed_abbey_2F.113.d.n8.name=Sinceramente, solo parecías una buena pelea.
adv.monastery_unhallowed_abbey_2F.97.d.n0.text=Un campo rojo translúcido y reluciente bloquea tu camino. Gritos de dolor resuenan en la sala a tu espalda.
adv.phyrexia_phyrexian_b1.62.d.n0.text=Un gran interruptor, bien visible, sobresale de la pared al fondo del laboratorio.
adv.phyrexia_phyrexian_b1.62.d.n1.text=Oyes el sonido de metal deslizándose contra metal a tu espalda.
adv.phyrexia_phyrexian_b1.62.d.n2.name=Accionar el interruptor
adv.phyrexia_phyrexian_b1.76.d.n0.text=Esta verja está cerrada con llave. Debe de haber otra forma de abrirla en algún otro lugar de aquí.
