adv.main_story_castles_red_castle.72.d.n0.text=Bienvenido, '{'var=player_name'}'. Lathliss ha estado esperando ansiosamente este momento.
adv.main_story_castles_red_castle.72.d.n1.text=Me temo que no tengo permitido hacer eso, no soy más que un dragón corriente, un mero sirviente de la poderosa Lathliss, reina de los dragones.
adv.main_story_castles_red_castle.72.d.n2.name=¿Ah, sí? Supongo que no te importará abrir esa verja delante de mí, ¿verdad?
adv.main_story_castles_red_castle.72.d.n3.text=Debes demostrar tu fuerza derrotando al menos a cuatro de los cinco enemigos que acechan en esta mazmorra para ser digno de una audiencia con mi ilustre ama.\n Afila tu espada, prepara tus hechizos y reúne valor, pues los desafíos que te esperan pondrán a prueba el temple incluso del guerrero más curtido.
adv.main_story_castles_red_castle.72.d.n4.name=¿Qué necesito hacer para pasar por esta verja?
adv.main_story_castles_red_castle.72.d.n6.name=Demostraré mi valía, solo asegúrate de abrir la verja cuando derrote a tus retadores.
adv.main_story_castles_red_castle.72.d.n7.text=Los retadores siguen con vida, no podrás pasar de esta verja
adv.main_story_castles_red_castle.72.d.n9.text=Estoy impresionada, eres bienvenido para reunirte con mi ama en el piso de arriba, aunque no puedo garantizar que sobrevivas a ese encuentro.
adv.main_story_castles_red_castle_f1.52.x.n0.text=Al asestar tu golpe final contra Lathliss, sientes un pulso de maná considerable.
adv.main_story_castles_red_castle_f1.52.x.n2.text=Al asestar tu golpe final contra Lathliss, sientes otro pulso de maná.
adv.main_story_castles_red_castle_f1.56.x.n0.text=Al asestar tu golpe final contra Lathliss, sientes un pulso de maná considerable.
adv.main_story_castles_red_castle_f1.56.x.n2.text=Al asestar tu golpe final contra Lathliss, sientes otro pulso de maná.
adv.main_story_castles_wastetown.55.d.n0.text=Una gran verja bloquea el paso.
adv.main_story_castles_wastetown.55.d.n2.text=La verja se ha abierto
adv.main_story_castles_wastetown.55.d.n3.name=Abrir con las cinco llaves de colores.
adv.main_story_castles_white_castle.55.d.n0.text=Llegas ante una verja.
adv.main_story_castles_white_castle.55.d.n1.text=Con una explosión ensordecedora, la verja estalla dejando solo cenizas a tu paso. Ya puedes pasar libremente.
adv.main_story_castles_white_castle.55.d.n2.name=¡Akroma, he hecho lo que me pediste! ¡Es hora de acabar con esto!
adv.main_story_castles_white_castle.55.d.n4.text=Con una explosión ensordecedora, la verja estalla dejando solo cenizas a tu paso. Ya puedes pasar libremente.
adv.main_story_castles_white_castle.55.d.n5.name=¡Akroma, he hecho lo que me pediste! ¡Es hora de acabar con esto!
adv.main_story_castles_white_castle.55.d.n7.text=NO ERES DIGNO, ¡LÁRGATE!
adv.main_story_castles_white_castle.55.d.n8.name=Llamas a la puerta.
adv.main_story_castles_white_castle.74.d.n0.text=Bienvenido, '{'var=player_name'}'. Akroma ha estado esperando ansiosamente este momento.
adv.main_story_castles_white_castle.74.d.n1.text=Me temo que no tengo permitido hacer eso, soy una mera sirviente de la poderosa Akroma, soberana de los Ángeles.
adv.main_story_castles_white_castle.74.d.n2.name=¿Ah, sí? Supongo que no te importará abrir esa verja delante de mí, ¿verdad?
adv.main_story_castles_white_castle.74.d.n3.text=Debes demostrar tu fuerza derrotando al menos a cuatro de los cinco enemigos que acechan en esta mazmorra para ser digno de una audiencia con mi ilustre ama.\n Afila tu espada, prepara tus hechizos y reúne valor, pues los desafíos que te esperan pondrán a prueba el temple incluso del guerrero más curtido.
adv.main_story_castles_white_castle.74.d.n4.name=¿Qué necesito hacer para pasar por esta verja?
adv.main_story_castles_white_castle.74.d.n6.name=Demostraré mi valía, solo asegúrate de abrir la verja cuando derrote a tus retadores.
adv.main_story_castles_white_castle.74.d.n7.text=Los retadores siguen con vida, no podrás pasar de esta verja.
adv.main_story_castles_white_castle.74.d.n9.text=En efecto, estoy impresionada, eres bienvenido para reunirte con mi ama en el piso de arriba, aunque no puedo garantizar que sobrevivas a ese encuentro.
adv.main_story_castles_white_castle_f1.50.x.n0.text=Al asestar tu golpe final contra Akroma, sientes un pulso de maná considerable. Pero, eliminada la amenaza inmediata, ahora puedes ver claramente que la sala cerrada al norte de la cámara no contiene ningún prisionero.
adv.main_story_castles_white_castle_f1.50.x.n2.text=Al asestar tu golpe final contra Akroma, sientes otro pulso de maná. Pero, como antes, la sala cerrada tras tu enemigo caído no contiene ningún prisionero.
adv.main_story_defend_waste_town_abandoned.76.d.n0.text=Uno de los pocos sonidos en la zona, la rueda de agua de este viejo molino cruje mientras gira lentamente en el agua de movimiento lento y color extraño.
adv.main_story_defend_waste_town_abandoned.77.d.n0.text=Estas tiendas están tan sin vida como el resto del pueblo, pero parece que quedan algunos objetos, sospechosamente intactos después de tanto tiempo.
adv.main_story_defend_waste_town_abandoned.78.d.n0.text=La posada está cerrada a cal y canto. El ayuntamiento, en cambio, no tiene puerta principal, pero no encuentras nada fuera de lo común en el interior, solo papeles desmoronados bien organizados y cubiertos de tinta ilegible.
adv.main_story_defend_waste_town_abandoned.79.d.n0.text=Las enredaderas que cubren estas casas parecen enfermizas, como si buscaran un sustento que no encuentran en la tierra de aquí.
adv.main_story_defend_waste_town_abandoned.82.d.n0.text=''Sepulcralmente quieto'' parece una descripción acertada para el cementerio. Casi te encuentras deseando que los muertos se levanten solo para que algo suceda.
adv.main_story_defend_waste_town_abandoned.83.d.n0.text=Tal y como describió el mercader, un pueblo vacío se extiende tras estas verjas. Incluso el viento parece más quieto aquí, como si temiera perturbar algo.
adv.main_story_defend_waste_town_abandoned.83.d.n1.text=Al acercarte más, resulta evidente que la mayoría de los edificios están intactos pero en un estado de abandono o directamente cubiertos de maleza. Es dudoso que alguien haya residido aquí en bastante tiempo.
adv.main_story_defend_waste_town_abandoned.83.d.n3.name=Hora de ir a cazar portales. Supongo que no puedo pedirle indicaciones a nadie...
adv.main_story_defend_waste_town_abandoned.94.d.n0.text=Quizás solo sea cosa de tu imaginación, pero no puedes librarte de la sensación de que te observan mientras exploras la zona.
adv.main_story_explore_dig_site_0.61.d.n0.text=Solo vine a recoger unas piezas de maquinaria antigua. No esperaba que intentaran recogerME a MÍ. Al menos esta vez no eran serpientes...
adv.main_story_explore_dig_site_1.116.d.n0.text=La palanca parece firmemente sujeta al mecanismo, pero se balancea libremente de un lado a otro como si no estuviera conectada a nada.
adv.main_story_explore_frostbitten_cavern_0.30.d.n0.text=Por suerte para ti, y quizás también para los habitantes de esta cueva, la verja está congelada en posición abierta en lugar de cerrada.
adv.main_story_explore_frostbitten_cavern_1.19.d.n0.text=Flores crecen, o lo intentan, en todos los rincones de la cueva. Estalactitas de hielo salpican un techo blanco y brillante como una lámpara de araña, y aquí dentro hace mucho más calor de lo que esperarías.
adv.main_story_explore_frostbitten_cavern_1.25.d.n0.text=Esta flor tiene un tono violeta muy intenso.
adv.main_story_explore_frostbitten_cavern_1.25.d.n1.name=Coger la flor
adv.main_story_explore_frostbitten_cavern_1.26.d.n0.text=Esta flor tiene un tono escarlata muy romántico.
adv.main_story_explore_frostbitten_cavern_1.26.d.n1.name=Coger la flor
adv.main_story_explore_frostbitten_cavern_1.8.d.n0.text=El mago en el corazón de la caverna te gruñe: "Si mis compañeros no te han dado una bienvenida suficientemente fría, permíteme..."
adv.main_story_explore_frostbitten_cavern_1.8.d.n1.text="No. Ahora largo de aquí.
adv.main_story_explore_frostbitten_cavern_1.8.d.n2.name="Solo necesito una de esas flores..."
adv.main_story_explore_frostbitten_cavern_1.8.d.n3.name=(Luchar)
adv.main_story_explore_frostbitten_cavern_1.8.d.n4.name=(Huir)
adv.main_story_explore_frostbitten_cavern_1.8.d.n5.name=(Luchar)
adv.main_story_explore_frostbitten_cavern_1.8.d.n6.name=(Huir)
adv.main_story_explore_library_of_varsil_1.25.d.n0.text=En esta estantería hay estudios anatómicos de varios animales corrientes. Abierto encima hay un texto sobre serpientes. ¿Por qué tenían que ser serpientes?
adv.main_story_explore_library_of_varsil_1.26.d.n0.text=Esta estantería contiene libros de recetas, pero muchos de los ingredientes te resultan desconocidos.
adv.main_story_explore_library_of_varsil_1.27.d.n0.text=Aquí encuentras, más que libros, montones de papeleo. Parece consistir en una serie de manifiestos de caravanas y libros de envíos adjuntos a mapas. Comentarios y preguntas garabateados en unos calendarios indican que quien recopiló estos registros sospechaba que los mercaderes asociados realizaban con frecuencia negocios adicionales no documentados a lo largo de sus rutas.
adv.main_story_explore_library_of_varsil_1.28.d.n0.text=''El Impacto de la Teletransportación Personal en el Comercio Intercity'' - No suena precisamente a lectura apasionante.
adv.main_story_explore_library_of_varsil_1.30.d.n0.text=El conocimiento que estos textos contenían en su día se ha perdido; sus páginas quedaron empapadas hace mucho en el mismo líquido oscuro que parece haber manchado las estanterías bajo ellos.
adv.main_story_explore_library_of_varsil_1.31.d.n0.text=Tomos cubiertos de polvo sobre temas anodinos llenan esta estantería. Tienes la sensación de que nadie los ha tocado en bastante tiempo.
adv.main_story_explore_library_of_varsil_1.32.d.n0.text=En esta estantería hay un diario con una cubierta resistente que destaca entre los pergaminos descoloridos a su alrededor. Sus anotaciones son un misterio para ti, sin embargo, pues están escritas en algún tipo de código.
adv.main_story_explore_library_of_varsil_1.33.d.n0.text=''Poemas Azgothianos de una Mañana de Verano''. Este libro te produce una sensación inquietante y decides, sabiamente, dejar la cubierta cerrada.
adv.main_story_explore_library_of_varsil_1.34.d.n0.text=Aquí encuentras una colección de biografías de magos de los que nunca has oído hablar, y un vistazo rápido a su contenido te hace preguntarte quién se molestaría en escribirlas.
adv.main_story_explore_library_of_varsil_1.35.d.n0.text=Una colección de dibujos infantiles llena esta estantería, aunque a diferencia de la mayoría de colecciones similares, todos parecen representar temas arcanos.
adv.main_story_explore_library_of_varsil_1.36.d.n0.text=Aquí encuentras un plano de la propia biblioteca. Por desgracia, no parece haber ninguna lista de pasadizos secretos que aprovechar.
adv.main_story_explore_library_of_varsil_2.26.d.n0.text=''La Condena del Bufón Loco'' se presenta como el relato ficticio de un hombre llamado Kuthuman, cuyos relatos meticulosamente detallados sobre mundos fantásticos elevaron su posición de mendigo a bufón real, antes de ser arrastrado por demonios en pleno tribunal del rey, sin que ninguna otra alma resultara herida.
adv.main_story_explore_library_of_varsil_2.26.d.n1.text=Este ejemplar viene precedido, sin embargo, por notas de un escriba según las cuales todas las figuras históricas mencionadas en el texto y sus interacciones parecen estar representadas con extrema precisión, lo que pone en duda el origen ficticio del relato de Kuthuman.
adv.main_story_explore_library_of_varsil_2.27.d.n0.text=Esta estantería es simplemente un revoltijo de páginas que parecen haberse desprendido de varios libros de toda la biblioteca. No ves nada de especial importancia entre ellas.
adv.main_story_explore_library_of_varsil_2.28.d.n0.text=''Meteorología Mágica'', ''El Poder Destructivo de los Cielos'', todos estos libros parecen centrarse en cosas que caen del cielo.
adv.main_story_explore_library_of_varsil_2.29.d.n0.text=''Lidiando con los Discapacitados Mágicos'' describe las dificultades en las comunidades de Shandalar para permitir que las personas sin talento mágico se sientan miembros plenamente participantes de la sociedad.
adv.main_story_explore_library_of_varsil_2.30.d.n0.text=Una pila de libros infantiles yace en esta estantería. El de más arriba cuenta la historia de una Brigada de Globos Goblin cuyos miembros no tienen nombre y se llaman entre sí ''Más Tonto que X'', donde X equivale al número de compañeros que se acuerda que son más listos ese día.
adv.main_story_explore_library_of_varsil_2.31.d.n0.text=Informes genealógicos y recopilaciones de datos censales cubren esta estantería. Comprensiblemente, están bastante polvorientos, lo que hace aún más evidente que varios libros han sido retirados recientemente.
adv.main_story_explore_library_of_varsil_2.32.d.n0.text=Encuentras un libro sobre la biología de los Elfos. Una página está marcada con la esquina doblada y describe un tipo de Elfo que no has visto en ningún lugar de Shandalar.
adv.main_story_explore_library_of_varsil_2.34.d.n0.text=''Relato Histórico de una Incursión Costera'', esta es una colección de entrevistas realizadas a los supervivientes de un pueblo pesquero costero que fue saqueado por criaturas desconocidas que simplemente salieron del mar caminando.
adv.main_story_explore_library_of_varsil_2.35.d.n0.text=Una colección de escritos sobre los Fragmentos de Maná: desde teorías sobre cómo absorben maná mientras están enterrados bajo tierra, hasta dibujos fantasiosos como un molino de grano funcionando junto a un cauce seco, alimentado por fragmentos en lugar de agua.
adv.main_story_explore_library_of_varsil_2.36.d.n0.text=''El Precio de la Magia'' no se centra en los efectos directos de los hechizos, sino en el coste y las consecuencias de lanzarlos. No es un libro muy popular.
adv.main_story_explore_library_of_varsil_2.38.d.n0.text=''El Lince Perdido'' parece ser una comparación biológica y de comportamiento entre felinos domesticados y Leoninos. El texto plantea varias teorías, concluyendo que uno de los dos fue el resultado de que la investigación de un antiguo mago se aplicara mal.
adv.main_story_explore_library_of_varsil_3.26.d.n0.text=''Las Ciudades Más Inflamables de Shandalar''. Bueno, este suena a lectura ligera...
adv.main_story_explore_library_of_varsil_3.27.d.n0.text=Aquí encuentras una colección de biografías de magos de los que nunca has oído hablar. Ninguno de ellos parece haber logrado nada significativo.
adv.main_story_explore_library_of_varsil_3.28.d.n0.text=Diarios de soldados, todos de una época similar pero de varios ejércitos distintos, se encuentran aquí. Entre todos ellos, parece que se podría reconstruir un relato completo de las batallas comunes.
adv.main_story_explore_library_of_varsil_3.30.d.n0.text=''El Arte del Contrahechizo Sutil'' es una lectura muy útil si tienes tiempo para ella.
adv.main_story_explore_library_of_varsil_3.31.d.n0.text=Aquí se recopilan registros de manifiestos de caravanas. Todo el contenido parece mundano, pero alguien ha rodeado varios artículos y garabateado notas con una letra tan desordenada que resulta prácticamente ilegible.
adv.main_story_explore_library_of_varsil_3.32.d.n0.text=''Informe Sobre una Amenaza Urgente para Todas las Naciones Civilizadas'' es un título bastante rimbombante para un informe de reconocimiento, pero eso es lo que encuentras aquí.
adv.main_story_explore_library_of_varsil_3.32.d.n1.text=El informe, relativamente reciente para los estándares de esta biblioteca, describe una colmena de Astillas que empequeñece a las ciudades más grandes de Shandalar. Incluye un mapa detallado de la ubicación.
adv.main_story_explore_library_of_varsil_3.32.d.n3.name=(Dejar el informe)
adv.main_story_explore_library_of_varsil_3.32.d.n4.text=Marcas la ubicación del Panal en tu propio mapa por si decides investigarlo más adelante.
adv.main_story_explore_library_of_varsil_3.32.d.n5.name=¿Quizás siga ahí? Vamos a anotar la ubicación.
adv.main_story_explore_library_of_varsil_3.34.d.n0.text=Aquí encuentras una colección de biografías de magos de los que nunca has oído hablar. Ninguno de ellos parece haber logrado nada significativo.
adv.main_story_explore_library_of_varsil_3.35.d.n0.text=Aquí encuentras una colección de planos copiados de varios inventos goblin. El transcriptor añadió notas junto a cada uno, calificándolos en una escala que va de ''Seguro que explota'' a ''No funcionará lo suficiente como para explotar''.
adv.main_story_explore_library_of_varsil_3.36.d.n0.text=''Cómo Entrenar a tu Tejón'', de Mangaverde... ¿Qué es más ridículo, el tema o el seudónimo?
adv.main_story_explore_library_of_varsil_3.37.d.n0.text=''Calor Párdico'' es, entre todas las cosas que se pueden encontrar aquí, una novela romántica. Cuenta la historia de una llama naciente entre magos condenados por el destino.
adv.main_story_explore_library_of_varsil_3.50.d.n0.text=''Formas Comunes de Imitadores'' sería en realidad un libro bastante útil de leer, si no se esforzara tanto en comerte.
adv.main_story_explore_library_of_varsil_3.51.d.n0.text="...s35 mantuvo su insistencia en no haber sido invocado anteriormente. Sin embargo, al iniciar la etapa siete, s35 mostró signos reducidos de malestar y pareció anticipar, al menos de forma subconsciente, el peligro que se aproximaba en la etapa doce, momento en el que invocamos a s36 para..."
adv.main_story_explore_library_of_varsil_3.51.d.n1.text=Esto parece ser la investigación que buscabas.
adv.main_story_explore_library_of_varsil_3.51.d.n3.text=Probablemente haya más cosas que encontrar aquí, pero ya tienes lo que pidió sir Donovan y podrías marcharte por donde entraste.
adv.main_story_explore_library_of_varsil_3.51.d.n4.name=Coger los documentos
adv.main_story_explore_library_of_varsil_3.51.d.n6.text=Con la enorme máquina de arriba ya derrotada, tu trabajo aquí ha terminado.
adv.main_story_explore_library_of_varsil_3.51.d.n7.name=Coger los documentos
adv.main_story_explore_library_of_varsil_4.27.x.n0.text=Con esta máquina monstruosa fuera de servicio, derrotar a sus compañeros (relativamente) más pequeños podría dejarse a aventureros de menor nivel, pero aún no has encontrado los documentos que quería sir Donovan. Deben de estar en algún lugar de abajo.
adv.main_story_explore_library_of_varsil_4.27.x.n2.text=Con esta máquina monstruosa fuera de servicio, derrotar a sus compañeros (relativamente) más pequeños podría dejarse a aventureros de menor nivel. Ya has encontrado los documentos que quería sir Donovan y puedes informarle ahora o volver abajo a explorar más primero.
adv.main_story_explore_library_of_varsil_4.28.x.n0.text=Con esta máquina monstruosa fuera de servicio, derrotar a sus compañeros (relativamente) más pequeños podría dejarse a aventureros de menor nivel, pero aún no has encontrado los documentos que quería sir Donovan. Deben de estar en algún lugar de abajo.
adv.main_story_explore_library_of_varsil_4.28.x.n2.text=Con esta máquina monstruosa fuera de servicio, derrotar a sus compañeros (relativamente) más pequeños podría dejarse a aventureros de menor nivel. Ya has encontrado los documentos que quería sir Donovan y puedes informarle ahora o volver abajo a explorar más primero.
adv.main_story_explore_library_of_varsil_4.29.x.n0.text=Con esta máquina monstruosa fuera de servicio, derrotar a sus compañeros (relativamente) más pequeños podría dejarse a aventureros de menor nivel, pero aún no has encontrado los documentos que quería sir Donovan. Deben de estar en algún lugar de abajo.
adv.main_story_explore_library_of_varsil_4.29.x.n2.text=Con esta máquina monstruosa fuera de servicio, derrotar a sus compañeros (relativamente) más pequeños podría dejarse a aventureros de menor nivel. Ya has encontrado los documentos que quería sir Donovan y puedes informarle ahora o volver abajo a explorar más primero.
adv.main_story_explore_library_of_varsil_4.33.d.n0.text=Si hay alguna información que rescatar de las páginas hechas jirones amontonadas por este suelo, dependerá de los eruditos que puedan recordar algo de lo que fueron. Pero mientras te acercas, el portal se abre, ofreciendo una ruta rápida de vuelta a la entrada.
adv.main_story_explore_library_of_varsil_4.35.d.n0.text=Ante ti se alza uno de los constructos más grandes que has visto jamás. A diferencia de los gólems de abajo, su forma parece menos inspirada en otros humanoides y más una silueta única y propia.
adv.main_story_explore_library_of_varsil_4.35.d.n1.text=Detrás de la máquina ves los restos de muchos libros arrancados de las estanterías de abajo, ahora hechos pedazos.
adv.main_story_explore_library_of_varsil_4.35.d.n3.text=(Nota: Este encuentro es difícil y opcional)
adv.main_story_plains_capital.64.d.n0.text=Hola. No hay nada que puedas hacer aquí...\nPor ahora.
adv.main_story_spawn.69.d.n0.text=Hola, caminante de planos '{'var=player_name'}'.
adv.main_story_spawn.69.d.n1.text=Esto... es Shandalar. Un plano donde el maná es tan abundante y usado por todos los seres conscientes que incluso la gente común lanza hechizos a diario.
adv.main_story_spawn.69.d.n11.text=Son Monedas de Desafío. Los lanzadores de hechizos de Shandalar suelen reunirse para celebrar pruebas de habilidad. Estas monedas te darán acceso a esos concursos, y los premios disponibles pueden ayudarte en tu viaje.
adv.main_story_spawn.69.d.n12.name=¿Qué son entonces? ¿Para qué sirven?
adv.main_story_spawn.69.d.n13.text=Muestra la moneda a los posaderos. Si hay un grupo en el pueblo, el posadero te dirigirá hacia ellos.
adv.main_story_spawn.69.d.n14.name=¿Dónde son estos concursos?
adv.main_story_spawn.69.d.n15.text=Ahora reabriré el portal por el que llegaste, pero no puede devolverte al lugar del que vienes. Al otro lado encontrarás los páramos de Shandalar, que yo, y ahora tú también, llamamos hogar.
adv.main_story_spawn.69.d.n16.name=Gracias
adv.main_story_spawn.69.d.n17.name=(Marcharse)
adv.main_story_spawn.69.d.n18.text=Ahora reabriré el portal por el que llegaste, pero no puede devolverte al lugar del que vienes. Al otro lado encontrarás los páramos de Shandalar, que yo, y ahora tú también, llamamos hogar.
adv.main_story_spawn.69.d.n19.name=Gracias.
adv.main_story_spawn.69.d.n2.name=¿Por qué estoy aquí?
adv.main_story_spawn.69.d.n20.name=(Marcharse)
adv.main_story_spawn.69.d.n21.name=Adiós.
adv.main_story_spawn.69.d.n22.text="¡'{'var=player_name'}'! ¡Siento que el hechizo de los Guardianes se debilita! Derrótalos a todos y quizá aún podamos salvarnos."
adv.main_story_spawn.69.d.n23.name="Adiós."
adv.main_story_spawn.69.d.n24.text="Me alegra volver a verte, '{'var=player_name'}'. Deduzco que has tenido cierto éxito en tu búsqueda."
adv.main_story_spawn.69.d.n25.text="Supongo que debería haberlo explicado mejor. Los guardianes que has derrotado no eran captores, no directamente. Pero su mera presencia tenía efectos que alteraban el mundo."
adv.main_story_spawn.69.d.n26.name="He derrotado a los ocupantes de los cinco castillos, pero no encontré ningún cautivo."
adv.main_story_spawn.69.d.n27.text="Probablemente viste una versión muy concentrada de los efectos de su presencia dentro de sus castillos. Pero también velaron ciertas zonas de nuestro mundo, haciendo que quedaran... ''ocultas'', a falta de un término mejor."
adv.main_story_spawn.69.d.n28.name="¿Efectos como cuáles?"
adv.main_story_spawn.69.d.n29.text="El hechizo que creó su presencia combinada provocó sutiles trucos de la mente que nos hicieron pasar por alto partes de nuestro mundo. Incluidas las prisiones que SÍ contienen a los Caminantes de Planos. Creo que ahora podrás encontrarlas..."
adv.main_story_spawn.69.d.n3.text=Como tú, algunos caminantes de planos han sido aprisionados aquí por los guardianes de los castillos. Debes derrotarlos en combate para liberarnos de este plano. Usa tus poderes mágicos para desafiarlos.
adv.main_story_spawn.69.d.n31.text=[RED]Nota del desarrollador:[] Has llegado al final del contenido de historia disponible por ahora, pero aún queda más por descubrir en Shandalar. Se han añadido varias mazmorras difíciles a tu mapa del mundo, y tu colección de cartas puede seguir creciendo.
adv.main_story_spawn.69.d.n33.text=[RED'}'Nota del desarrollador:[] Vuelve a hablar con este PNJ después de actualizar Forge (o atento a los anuncios en nuestro Discord) para continuar la historia cuando esté lista. ¡Y gracias por venir con nosotros en esta Aventura!
adv.main_story_spawn.69.d.n35.name=(Capítulo 1 completado)
adv.main_story_spawn.69.d.n36.text=Hola de nuevo
adv.main_story_spawn.69.d.n37.name=Quiero cambiar las cinco llaves de colores por un mox de mi elección y la llave de la sala de Emrakul
adv.main_story_spawn.69.d.n5.text=Encuentra a los caminantes de planos atrapados aquí. Guíalos hasta mí, te ayudarán en tu viaje.
adv.main_story_spawn.69.d.n7.text=Toma esta runa. Puedes usarla en cualquier momento para volver aquí. Ten cuidado, caminante de planos.
adv.main_story_spawn.69.d.n9.text=Tengo algo más para ti, '{'var=player_name'}'. Toma estas monedas, pero no las gastes con mercaderes.
adv.main_story_temple_of_gideon_graveyard.256.d.n0.text=Al borde de un estanque reflectante se alza la representación tallada en piedra de un ángel. Posada como si luchara en pleno vuelo, el aire alrededor de la espada y el escudo de la estatua reluce con una neblina prismática. En otro contexto, sería majestuosa. Pero aquí, resulta amenazante.
adv.main_story_temple_of_gideon_graveyard.256.d.n10.text=Con la estatua destruida, ya no sientes la pesada presencia que antes te alejaba de los límites del cementerio.
adv.main_story_temple_of_gideon_graveyard.256.d.n11.name=Buscar una salida
adv.main_story_temple_of_gideon_graveyard.256.d.n2.text=Sientes una cantidad inmensa de poder irradiando del monumento. También empiezas a notar que muchos de los símbolos sagrados familiares grabados en la base están retorcidos, incompletos, alterados o de algún modo parecen ''incorrectos''.
adv.main_story_temple_of_gideon_graveyard.256.d.n3.name=Examinar de cerca la estatua
adv.main_story_temple_of_gideon_graveyard.256.d.n5.text=Hagas lo que hagas, parece estar funcionando. El resplandor alrededor de las armas de la estatua empieza a desvanecerse, al igual que la barrera alrededor del cementerio. También descubres que eres capaz de canalizar esta energía, y te sientes algo revitalizado por ella. (+15 de salud recuperada)
adv.main_story_temple_of_gideon_graveyard.256.d.n6.name=Drenar el poder de la estatua
adv.main_story_temple_of_gideon_graveyard.256.d.n7.text=La estatua empieza a agrietarse y moverse, pero no se desmorona. En su lugar, habla: "¡¡TE ENTROMETES CON PODERES QUE DESCONOCES, MORTAL!!". Apenas tienes tiempo de procesarlo antes de que ataque.
adv.main_story_temple_of_gideon_steppe.237.d.n0.text=Entras por la verja.
adv.main_story_temple_of_gideon_steppe.237.d.n1.text=Con una ráfaga de llamas rojas, la puerta se consume dejando solo cenizas a tu paso. Ya puedes pasar libremente.
adv.main_story_temple_of_gideon_steppe.237.d.n2.name=¡Lathliss! ¡Es hora de acabar con esto!
adv.main_story_temple_of_gideon_steppe.237.d.n4.text=NO ERES DIGNO, ¡LÁRGATE!
adv.main_story_temple_of_gideon_steppe.237.d.n5.name=Llamas a la puerta
adv.main_story_temple_of_gideon_steppe.240.d.n0.text=Una vieja bruja te observa con recelo, pero no levanta su bastón para atacar.
adv.main_story_temple_of_gideon_steppe.240.d.n2.name=Atacar a la bruja
adv.main_story_temple_of_gideon_steppe.240.d.n3.text="¡Aléjate de aquí! ¡No los tendrás!" Retrocede un paso, dejando caer parte de las hierbas y hongos que parecía estar recogiendo.
adv.main_story_temple_of_gideon_steppe.240.d.n4.name=Acercarse despacio
adv.main_story_temple_of_gideon_steppe.240.d.n6.name=Atacar a la bruja
