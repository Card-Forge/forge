adv.main_story_castles_green_castle.72.d.n0.text=Bienvenido, '{'var=player_name'}'. La reina Ghalta ha estado esperando ansiosamente este momento.
adv.main_story_castles_green_castle.72.d.n1.text=Me temo que no tengo permitido hacer eso, soy un mero sirviente de la poderosa Ghalta, reina de los Dinosaurios.
adv.main_story_castles_green_castle.72.d.n2.name=¿Ah, sí? Supongo que no te importará abrir esa verja delante de mí, ¿verdad?
adv.main_story_castles_green_castle.72.d.n3.text=Debes demostrar tu fuerza derrotando al menos a cuatro de los cinco enemigos que acechan en esta mazmorra para ser digno de una audiencia con mi ilustre ama, que domina este reino de dinosaurios.\n Afila tu espada, prepara tus hechizos y reúne valor, pues los desafíos que te esperan pondrán a prueba el temple incluso del guerrero más curtido.
adv.main_story_castles_green_castle.72.d.n4.name=¿Qué necesito hacer para pasar por esta verja?
