adv.aerie_aerie_0.92.d.n0.text=Bienvenido '{'var=player_name'}', veo que has venido a ver algunas de nuestras mejores aves. Debes de ser bastante listo al acudir a nosotros, ¡ya que nuestros precios son inigualables comparados con los de otros vendedores de Shandalar!
adv.aerie_aerie_0.92.d.n1.text=Soy un trabajador del gremio del aviario, uno de los mayores conglomerados de criadores de las diversas especies de aves de Shandalar. Tenemos varios centros de cría como este repartidos por los distintos biomas de Shandalar. Mi tarea es vender esas aves a aventureros ansiosos como tú. Así que echa un vistazo.
adv.aerie_aerie_0.92.d.n2.name=¿Quién eres?
adv.aerie_aerie_0.92.d.n3.text=Me temo que no. Nuestro gremio protege mucho sus técnicas de cría, desarrolladas a lo largo de más de mil años. Por eso no queremos que nuestros competidores husmeen en nuestro negocio. Si alguien sin permiso entra en el aviario, será reprendido por los guardias e incluso por las propias aves, entrenadas para atacar a intrusos no deseados.
adv.aerie_aerie_0.92.d.n4.name=¿Puedo entrar en el aviario?
adv.aerie_aerie_0.92.d.n6.name=Gracias por la información. Adiós.
adv.aerie_aerie_1.99.d.n0.text=La inscripción dice: Se advierte a los visitantes no autorizados, aves peligrosas más adelante.
adv.cave_cave_dwarf.84.d.n0.text=La inscripción dice: No entrar, muerte en el interior
adv.cave_cave_multilevel_cave_16BR3U.83.d.n0.text=Una gran verja bloquea el paso. A través de los barrotes puedes ver una figura imponente en la sala más allá. (Necesitas los cinco fragmentos de esta mazmorra para abrir esta verja.)
adv.cave_cave_multilevel_cave_16BR3U.83.d.n2.text=La verja se ha abierto.
adv.cave_cave_multilevel_cave_16BR3U.83.d.n3.name=Abrir con los cinco fragmentos
adv.debug_map.52.d.n0.text=Soy una gran verja. Saludos.
adv.debug_map.52.d.n1.name=De acuerdo...
adv.debug_map.69.d.n0.text=No me hagas caso, solo estoy relajándome.
adv.debug_map.69.d.n1.name=Claro.
adv.debug_map.80.d.n0.text=Soy un elfo. Hago cosas de elfo, como abrazar árboles y ser guapo.
adv.debug_map.80.d.n1.name=Vale
adv.debug_map.80.d.n10.name=¡ESPERA, ERA UNA BROMA!
adv.debug_map.80.d.n11.text=Se ha ido. Llorando. Eres un monstruo.
adv.debug_map.80.d.n12.name=¿Adónde se ha ido Emrakul?
adv.debug_map.80.d.n13.name=Lo siento...
adv.debug_map.80.d.n14.text=¡Lo has entendido! Toma este objeto.
adv.debug_map.80.d.n15.name=Eso mola, verde amigo.
adv.debug_map.80.d.n16.name=Gracias, tío.
adv.debug_map.80.d.n17.text=De nada.
adv.debug_map.80.d.n18.name=Gracias por la bendición.
adv.debug_map.80.d.n19.name=Emoji de pulgar arriba
adv.debug_map.80.d.n2.text=Con gusto.
adv.debug_map.80.d.n20.text=Si me das un Tesoro, te daré la bendición del Elfo de Depuración.\nQue consiste en un Elfo de Llanowar y 2 puntos de vida extra en tu próxima batalla. ¿Suena bien?
adv.debug_map.80.d.n21.name=¿Tienes alguna bendición élfica elegante?
adv.debug_map.80.d.n22.name=¡Pero amo mi Tesoro! Rehúso humildemente.
adv.debug_map.80.d.n23.name=Lo acepto
adv.debug_map.80.d.n24.text=Ya que lo pides amablemente, lo haré.
adv.debug_map.80.d.n25.name=¿Puedes abrir esa pared oculta?
adv.debug_map.80.d.n26.name=Gracias, tío.
adv.debug_map.80.d.n27.text=Ah, quizá puedas ayudarme. ¿Puedes preguntarle al Demonio de Depuración cuál es su color favorito?
adv.debug_map.80.d.n28.name=¿Tienes alguna misión?
adv.debug_map.80.d.n29.name=Es raro, pero vale.
adv.debug_map.80.d.n3.name=¡Pelea conmigo, elfo!
adv.debug_map.80.d.n30.name=Ese tipo me asusta, prefiero no hacerlo.
adv.debug_map.80.d.n31.text=Por favor, dime qué responde el Demonio de Depuración.
adv.debug_map.80.d.n32.name=Sobre esa misión...
adv.debug_map.80.d.n33.name=Claro
adv.debug_map.80.d.n34.text=Ah. Ya veo. Gracias, amigo, toma este oro por las molestias.
adv.debug_map.80.d.n35.name=Entendido, tío.
adv.debug_map.80.d.n36.name=Gracias
adv.debug_map.80.d.n4.name=Oye, ¿no eres un poco musculoso para ser un elfo...?
adv.debug_map.80.d.n5.text=Escucha al bosque, amigo.\n¡Tu identidad de color ahora es verde!
adv.debug_map.80.d.n6.name=Yo también quiero ser ecológico.
adv.debug_map.80.d.n7.name=Genial.
adv.debug_map.80.d.n8.text=¿En serio? Bueno... allá tú.\n¡EY, EMMY! ¡ESTE PRINGADO QUIERE BAILAR!
adv.debug_map.80.d.n9.name=¡Quiero luchar contra Emrakul, esa de ahí!
adv.debug_map.80.x.n0.text=Impresionante...
adv.debug_map.80.x.n1.name=Oye, ¿por qué sigues en pie...?
adv.debug_map.81.d.n0.text=Tú... ¡tú has herido a Grog!\n¡Tú... sucio cerdo! ¡No pararé hasta verte derrotado!\n¡Dioses... quien sea! ¡Concededme fuerza! ¡Concededme VENGANZA!
adv.debug_map.81.d.n1.name=Uy, oh.
adv.debug_map.82.d.n0.text=...
adv.debug_map.82.d.n1.name=¿¿¿?
adv.debug_map.83.d.n0.text=Tengo cosas que ofrecerte a cambio de esa vida que llevas...
adv.debug_map.83.d.n1.name=Eres sospechoso y tienes dos sombras, paso.
adv.debug_map.83.d.n10.name=Me gusta tu rollo.
adv.debug_map.83.d.n11.name=Vaya hombre...
adv.debug_map.83.d.n12.text=Puedo ofrecerte este Tesoro por el precio justo de 200 de oro.
adv.debug_map.83.d.n13.name=¿Algún trato demoníaco interesante?
adv.debug_map.83.d.n14.name=Esta gema tiene mucho estilo, como yo. ¡Trato hecho!
adv.debug_map.83.d.n15.name=Me lo pensaré.
adv.debug_map.83.d.n16.text=Dame ese Tesoro tuyo...\n(+1 de vida, Visión de maná, velocidad de movimiento 120%, Lord of the Pit entra en juego)
adv.debug_map.83.d.n17.name=¿Tienes alguna bendición demoníaca elegante?
adv.debug_map.83.d.n18.name=Eso es turbio.
adv.debug_map.83.d.n19.name=¿Qué podría salir mal?
adv.debug_map.83.d.n2.text=¡Vaya, tenemos aquí a un tipo duro!
adv.debug_map.83.d.n20.text=Rosa. Es el color de mis batidos de sangre favoritos.\nMuy oscuro y malvado.
adv.debug_map.83.d.n21.name=Oye, ¿cuál es tu color favorito?
adv.debug_map.83.d.n22.name=Gracias, Satán.
adv.debug_map.83.d.n3.name=¡Te venceré, demonio!
adv.debug_map.83.d.n4.name=¡En guardia!
adv.debug_map.83.d.n5.text=Puedes ser oscuro y siniestro como yo. Quizá a cambio de algo de tu fuerza vital...
adv.debug_map.83.d.n6.name=Me gusta tu rollo.
adv.debug_map.83.d.n7.name=Mi fuerza vital no, ¡moriría sin ella!
adv.debug_map.83.d.n8.name=No estoy haciendo nada mejor con ella.
adv.debug_map.83.d.n9.text=No tienes suficiente fuerza vital... vuelve cuando tengas más que ofrecer.\nCome sano, lee un libro, cuida bien tu alma.
adv.debug_map.91.d.n0.text=*glub*\n(Según tu diccionario de Pez a Español, te está saludando)
adv.debug_map.91.d.n1.name=Glub.
adv.debug_map.91.d.n2.text=*glub*\n(Tu color de identidad ahora es azul)
adv.debug_map.91.d.n3.name=Me gusta tu aspecto de pez. A mí también me gustaría ser azul y oler raro.
adv.debug_map.91.d.n4.name=Está funcionando. Vaya, ya me apetece comer krill.
adv.debug_map.91.d.n5.text=*glub, glub*\n (Fascinante.)
adv.debug_map.91.d.n6.name=He hablado con la puerta. Por alguna razón creo que esto te va a parecer relevante.
adv.debug_map.91.d.n7.name=Lo sé, ¿verdad?
adv.emrakul_emrakul.71.d.n0.text=Una enorme barrera mágica roja bloquea el paso.
adv.emrakul_emrakul.71.d.n2.text=La verja se ha abierto.
adv.emrakul_emrakul.71.d.n3.name=Abrir con la llave extraña
adv.emrakul_wastetown.69.d.n0.text=Hola, caminante de planos '{'var=player_name'}'. Esta zona está actualmente en construcción y sujeta a cambios. Además, este es un jefe difícil, así que ven preparado con un mazo fuerte.
adv.evilgrove_evilgrove_5_swamp.117.d.n0.text=La inscripción dice: El Parque Nacional Neverglades ha sido cerrado a los visitantes debido a la llegada de invitados no deseados en el perímetro del parque
adv.fort_fort_colorless_2_wizards.73.d.n0.text=Un campo rojo translúcido y reluciente bloquea tu camino. Gritos de dolor resuenan en la sala a tus espaldas.
adv.fort_fort_colorless_2_wizards.73.d.n2.text=La barrera se desvanece en el infinito ante ti.
adv.fort_fort_colorless_2_wizards.73.d.n3.name=Colocar la mano sobre la barrera
