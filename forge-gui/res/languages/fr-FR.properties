lblSummary=R\u00E9sum\u00E9
advModeStandardSummary=Mode\u00A0: Standard\n\nVotre deck de d\u00E9part est compos\u00E9 de 2 \u00E0 3 paquets Jumpstart de vingt cartes chacun.\n\n
advDiffEasyStandard=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, Facile, vous recevrez trois packs de d\u00E9marrage de la couleur choisie.
advDiffNormalStandard=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, Normal, vous recevrez deux packs de d\u00E9marrage de la couleur choisie et un d'une couleur alli\u00E9e.
advDiffHardStandard=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, Difficile, vous recevrez un pack de d\u00E9marrage de la couleur choisie et un autre d'une couleur alli\u00E9e.
advDiffInsaneStandard=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, D\u00E9ment, vous recevrez un pack de d\u00E9marrage de la couleur choisie et un autre d'une couleur alli\u00E9e.
advCannotDetermineStarterDeck=((Impossible de d\u00E9terminer le deck de d\u00E9part en fonction des param\u00E8tres de difficult\u00E9 personnalis\u00E9s))
advModeConstructedSummary=Mode\u00A0: Construit\n\nVous recevrez un deck pr\u00E9construit sp\u00E9cifique en fonction de la couleur et du niveau de difficult\u00E9 que vous avez choisis.\n\n
advDiffEasyConstructed=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, Facile, votre deck ne contiendra que la couleur choisie.
advDiffNormalConstructed=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, Normal, votre deck contiendra la couleur choisie et une couleur alli\u00E9e.
advDiffHardConstructed=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, Difficile, votre deck contiendra la couleur choisie et une couleur oppos\u00E9e.
advDiffInsaneConstructed=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, D\u00E9ment, votre deck contiendra la couleur choisie et une couleur oppos\u00E9e.
advModePileSummary=Mode\u00A0: Pile\n\nVous recevrez une pile de cartes al\u00E9atoire en fonction de la couleur et du niveau de difficult\u00E9 que vous avez choisis.\n\n
advDiffEasyPile=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, Facile, votre deck ne contiendra que votre couleur choisie et une couleur alli\u00E9e.
advDiffNormalPile=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, Normal, votre deck contiendra votre couleur choisie et deux couleurs alli\u00E9es.
advDiffHardPile=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, Difficile, votre deck contiendra votre couleur choisie et deux couleurs alli\u00E9es.
advDiffInsanePile=Au niveau de difficult\u00E9 actuellement s\u00E9lectionn\u00E9, D\u00E9ment, votre deck contiendra votre couleur choisie et deux couleurs alli\u00E9es.
advPileLessRareReward=Vous recevrez moins de cartes peu communes et rares qu'en mode Normal.
advModeChaosSummary=Mode\u00A0: Chaos\n\nVous (et tous les ennemis) recevrez un deck pr\u00E9construit al\u00E9atoire.\n\nAttention\u00A0: La difficult\u00E9 des rencontres sera ainsi tr\u00E8s variable par rapport aux intentions des d\u00E9veloppeurs.
advModeCustomGeneticSummary=Mode\u00A0: Personnalis\u00E9\n\nChoisissez votre propre deck pr\u00E9construit. Les ennemis peuvent recevoir un deck IA g\u00E9n\u00E9tique al\u00E9atoire (difficile).\n\nAttention\u00A0: La difficult\u00E9 des rencontres variera consid\u00E9rablement par rapport aux intentions des d\u00E9veloppeurs.
advModeCustomSummary=Mode\u00A0: Personnalis\u00E9\n\nChoisissez votre propre deck pr\u00E9construit.
advModePreconSummary=Mode\u00A0: Pr\u00E9construit\n\nVous recevrez un deck pr\u00E9construit sp\u00E9cifique. Vous pouvez choisir un deck pr\u00E9construit al\u00E9atoire ou sp\u00E9cifique parmi une \u00E9dition de votre choix.\n\n
advModeCommanderSummary=Mode\u00A0: Commander\n\nVous recevrez un deck Commander pr\u00E9construit bas\u00E9 sur le th\u00E8me de couleurs choisi pour commencer la partie.\n\nBonne chance dans votre qu\u00EAte pour cr\u00E9er un deck coh\u00E9rent capable de gagner r\u00E9guli\u00E8rement et de vaincre les boss.
advModeCommanderPreconSummary=Mode\u00A0: Commander pr\u00E9construit\n\nChoisissez un deck Commander pr\u00E9construit nomm\u00E9 pour commencer la partie.\n\nCe mode utilise les r\u00E8gles de construction de deck et de jeu du Commander, mais vous permet de choisir parmi le dossier Commander pr\u00E9construit.
advNoModeSummaryAvailable=Aucun r\u00E9sum\u00E9 n'est disponible pour ce mode de jeu.
advRewardItem1=recueil de questions fr\u00E9quemment pos\u00E9es
advRewardItem2=\u00E9tui de pochettes pour cartes
advRewardItem3=tapis de jeu tr\u00E8s appr\u00E9ci\u00E9
advRewardItem4=exemplaire de l'autobiographie de Richard Garfield
advRewardItem5=collection de cartes al\u00E9atoires en langues \u00E9trang\u00E8res
advRewardItem6=pi\u00E8ce porte-bonheur
advRewardItem7=classeur \u00E0 fiches g\u00E9ant
advRewardItem8=bo\u00EEte non tri\u00E9e de mati\u00E8res communes
advRewardItem9=un seau rempli de morceaux d'artefacts bris\u00E9s
advRewardItem10=fragment de mana \u00E9puis\u00E9
advQuestNotFinished=Vous n'avez pas termin\u00E9 la derni\u00E8re chose que nous vous avons demand\u00E9e ! ({0})
advQuestGoTakeCareOfThat=Ah oui, laissez-moi m'en occuper.
advQuestComeBackTomorrow=Nous n'avons rien de nouveau \u00E0 vous proposer pour le moment. Revenez demain.
advQuestNeedAssistance=Aventurier, nous avons besoin de votre aide !
advQuestLogFull=Je ne peux pas, j'ai beaucoup trop de choses \u00E0 faire en ce moment (Votre journal de qu\u00EAtes est d\u00E9j\u00E0 plein) (Quitter)
advRewardShopCardDisplayRatio=Ratio d'affichage des cartes de fid\u00E9lit\u00E9/cartes de magasin
advRewardShopCardTooltipRatio=Ratio infobulle carte de r\u00E9compense/carte de magasin
advRedeemChallengeCoin=\u00C9changer une pi\u00E8ce de d\u00E9fi [+ChallengeCoin]
advRedeemSilverChallengeCoin=\u00C9changez une pi\u00E8ce de d\u00E9fi [+SilverChallengeCoin]
advRedeemBronzeChallengeCoin=\u00C9changez une pi\u00E8ce de d\u00E9fi [+BronzeChallengeCoin]
advPairingsNotGenerated=Appariements non encore g\u00E9n\u00E9r\u00E9s
advDeckMissingForEnemy=Le deck pour {0} est manquant !
advGeneticAiDeckWillBeUsed=Un jeu de cartes d'IA g\u00E9n\u00E9tique sera utilis\u00E9.
advPlayerDeckWillBeUsed=Le jeu de cartes du joueur sera utilis\u00E9.
advPrizeDraftFirst=Prix \u200B\u200Bpour la premi\u00E8re place au classement g\u00E9n\u00E9ral de l'\u00E9v\u00E9nement de draft
advPrizeSealedFirst=Prix \u200B\u200Bpour la premi\u00E8re place au classement g\u00E9n\u00E9ral de l'\u00E9v\u00E9nement scell\u00E9
advEventTypeBoosterDraft=Type d'\u00E9v\u00E9nement\u00A0: Draft de boosters
advDraftPrizesDesc=Prix\nVictoires en 3 manches\u00A0: 500 pi\u00E8ces d'or\nVictoires en 2 manches\u00A0: 200 pi\u00E8ces d'or\nVictoire en 1 manche\u00A0: 100 pi\u00E8ces d'or\n
advJumpstartParticipationPrize=La participation \u00E0 cet \u00E9v\u00E9nement vous permettra de recevoir un exemplaire sans valeur de chaque carte de votre deck Jumpstart.
