# Start dialog
msgTutFinishMatchFirst=Terminez ou quittez votre partie en cours avant de lancer le tutoriel.
msgTutIntro=Apprenez les bases de Magic dans une courte partie d'entra\u00EEnement : jouez un terrain, lancez un sort et payez son co\u00FBt, attaquez, bloquez et gagnez.\n\nRegardez d'abord la d\u00E9mo avec chaque action expliqu\u00E9e, puis choisissez \u00AB Essayer vous-m\u00EAme \u00BB pour jouer la m\u00EAme partie avec des indices.
btnTutWatchDemo=Voir la d\u00E9mo
btnTutTryYourself=Essayer vous-m\u00EAme
msgTutStartError=Impossible de d\u00E9marrer le tutoriel.\n{0}
# Win/lose screen labels
lblTutWatchAgain=Revoir la d\u00E9mo
lblTutPlayAgain=Rejouer
lblTutBackToMenu=Retour au menu
lblRestartPuzzle=Recommencer le puzzle
lblQuitPuzzle=Quitter le puzzle
# Generic notes
lblTutNeedHand=Besoin d'aide ?
lblTutKeepGoing=Continuez
lblTutNoProblem=Pas de probl\u00E8me
msgTutNoProblem=L'annulation remet le sort dans votre main. Relan\u00E7ons-le.
lblTutRestart=R\u00E9essayons
msgTutRestart={0}\n\nLa partie d'entra\u00EEnement recommence depuis le d\u00E9but.
lblTutDesync=La d\u00E9mo s'est d\u00E9synchronis\u00E9e
msgTutDesync=Un \u00E9v\u00E9nement inattendu s'est produit, la d\u00E9mo s'arr\u00EAte ici. Vous pouvez toujours choisir \u00AB Essayer vous-m\u00EAme \u00BB depuis Comment jouer.
lblTutPhaseOpp={0} (tour de l''adversaire)
msgTutWaitHint=Le tour de votre adversaire est en cours. Appuyez sur OK chaque fois que le jeu le demande.
# Board tour
lblTutTourTitle=Visite du plateau
btnTutTourShow=Afficher la visite
btnTutTourSkip=Passer
msgTutTour6Watch=La d\u00E9mo commence maintenant. Chaque note s'affiche d'abord et rien ne bouge tant que vous n'appuyez pas sur Suivant, prenez donc votre temps. Ensuite, la d\u00E9mo pointe la carte, clique pour vous et explique ce qui a chang\u00E9.\n\nPendant la d\u00E9mo, vos propres clics sur les cartes et les boutons OK / Fin du tour sont suspendus pour \u00E9viter toute d\u00E9synchronisation. Utilisez Suivant et Masquer si une note recouvre un \u00E9l\u00E9ment.
msgTutTour6Try=\u00C0 vous de jouer. \u00C0 chaque \u00E9tape, la carte sur laquelle cliquer brille et indique ce qu'il faut faire.
# Step 1: land
lblTutLand=\u00C9tape 1 sur 6 : Jouer un terrain
msgTutLand=C'est votre PHASE PRINCIPALE 1 (M1). C'est le moment de jouer un terrain et de lancer des sorts.\n\nLes terrains produisent du mana, la ressource d\u00E9pens\u00E9e pour les sorts. Vous pouvez jouer UN terrain par tour, et seulement pendant une phase principale.
msgTutLandTry=Cliquez sur la Montagne brillante dans votre main pour la jouer.
msgTutLandWatch=Regardez : la Montagne dans votre main va \u00EAtre cliqu\u00E9e pour \u00EAtre jou\u00E9e.
msgTutLandMissed=Vous avez d\u00E9pass\u00E9 votre phase principale sans jouer de terrain, il n'y a donc pas de mana pour l'\u00E9tape suivante.
lblTutLandDone=Votre Montagne est en jeu
msgTutLandDone=La Montagne est pass\u00E9e de votre MAIN au CHAMP DE BATAILLE.\n\nLes terrains se d\u00E9gagent au d\u00E9but de chacun de vos tours. S'ENGAGER un terrain (le tourner sur le c\u00F4t\u00E9) produit un mana ; une Montagne donne du mana rouge. Vous avez utilis\u00E9 votre pose de terrain pour ce tour.
# Step 2: cast
lblTutCast=\u00C9tape 2 sur 6 : Lancer un sort
msgTutCast=Les sorts co\u00FBtent du mana, indiqu\u00E9 dans le coin sup\u00E9rieur de la carte. Le Goblin enrag\u00E9 co\u00FBte '{'R'}' : un mana rouge, que la Montagne jou\u00E9e produit.\n\nLes sorts de cr\u00E9ature se lancent comme les terrains se jouent : en cliquant dessus dans votre main.
msgTutCastTry=Cliquez sur le Goblin enrag\u00E9 brillant dans votre main.
msgTutCastWatch=Regardez : le Goblin enrag\u00E9 dans votre main va \u00EAtre cliqu\u00E9 pour \u00EAtre lanc\u00E9.
msgTutCastMissed=Le sort n'a pas \u00E9t\u00E9 lanc\u00E9 ce tour-ci.
lblTutPay=Payer le mana
msgTutPay=Lancer un sort n\u00E9cessite d'en payer le co\u00FBt. Vous payez en ENGAGEANT des terrains pour du mana. Engager la Montagne donne '{'R'}', ce qui r\u00E8gle la totalit\u00E9 du co\u00FBt et place le sort sur la pile.
msgTutPayTry=Cliquez sur la Montagne brillante sur votre champ de bataille pour l'engager et produire du mana rouge.
msgTutPayWatch=Regardez : la Montagne va \u00EAtre cliqu\u00E9e pour \u00EAtre engag\u00E9e et produire du mana rouge.
lblTutStack=La pile
msgTutStack=Votre Goblin enrag\u00E9 n'est pas encore en jeu. Les sorts attendent d'abord sur la PILE (voir l'onglet Pile), afin que l'adversaire ait une opportunit\u00E9 de r\u00E9pondre. Lorsque les deux joueurs passent cons\u00E9cutivement, le sort sup\u00E9rieur se r\u00E9sout.\n\nVous avez la priorit\u00E9, ce qui signifie que vous pouvez agir \u00E0 nouveau. N'ayant rien d'autre \u00E0 faire, passez.
msgTutStackTry=Appuyez sur OK pour passer la priorit\u00E9 et laisser votre sort se r\u00E9soudre.
msgTutStackWatch=Regardez : OK va \u00EAtre appuy\u00E9 pour laisser le sort se r\u00E9soudre.
lblTutResolved=Goblin enrag\u00E9 r\u00E9solu
msgTutResolved=Il a quitt\u00E9 la pile et est entr\u00E9 sur le CHAMP DE BATAILLE. C'est une 1/1 : force 1, endurance 1.\n\nUne cr\u00E9ature qui vient d'arriver ne peut normalement pas attaquer avant votre prochain tour (\u00AB mal d'invocation \u00BB). Le Goblin enrag\u00E9 a la C\u00C9L\u00C9RIT\u00C9, ce qui annule cette attente et lui permet d'attaquer imm\u00E9diatement.
# Step 3: attack
lblTutAttack=\u00C9tape 3 sur 6 : Attaquer !
msgTutAttack=Le combat permet de blesser l'adversaire. Il comprend plusieurs phases : D\u00C9BUT DU COMBAT (BC), D\u00C9CLARATION DES ATTAQUANTS (DA), D\u00C9CLARATION DES BLOQUEURS (DB), D\u00C9G\u00C2TS DE COMBAT (CD) et FIN DU COMBAT (EC).\n\nQuittez d'abord la phase principale pour passer au combat.
msgTutToCombatTry=Appuyez sur OK pour passer au combat.
msgTutToCombatWatch=Regardez : OK va \u00EAtre appuy\u00E9 pour passer au combat.
lblTutDeclare=D\u00E9clarer les attaquants
msgTutDeclare=C'est la phase de D\u00C9CLARATION DES ATTAQUANTS (DA) : choisissez quelles cr\u00E9atures attaquent. Cliquez sur une cr\u00E9ature pour la marquer, puis appuyez sur OK.\n\nUne cr\u00E9ature attaquante S'ENGAGE (se tourne sur le c\u00F4t\u00E9) et ne pourra pas bloquer jusqu'\u00E0 votre prochain tour. C'est pourquoi le G\u00E9ant des collines reste en arri\u00E8re : il vous d\u00E9fendra plus tard.
msgTutDeclareTry=Cliquez sur le Goblin enrag\u00E9 brillant, puis appuyez sur OK.
msgTutDeclareWatch=Regardez : le Goblin enrag\u00E9 va \u00EAtre d\u00E9sign\u00E9 comme attaquant, puis OK sera appuy\u00E9.
lblTutDamage=D\u00E9g\u00E2ts de combat
msgTutDamageDealt=Votre adversaire n''avait aucune cr\u00E9ature pour bloquer, le Goblin enrag\u00E9 n''a pas \u00E9t\u00E9 bloqu\u00E9 et a inflig\u00E9 {0} d\u00E9g\u00E2ts. Votre adversaire est \u00E0 {1} points de vie.\n\nLe Goblin reste engag\u00E9 (sur le c\u00F4t\u00E9) jusqu''\u00E0 votre prochaine \u00E9tape de d\u00E9gagement.
msgTutCombatOver=Le combat est termin\u00E9.
# Step 4: end the turn
lblTutPass=\u00C9tape 4 sur 6 : Terminer votre tour
msgTutPass=Apr\u00E8s le combat vient la PHASE PRINCIPALE 2 (M2), une seconde chance de jouer un terrain ou de lancer des sorts ; puis l'\u00C9TAPE DE FIN (ET) et le NETTOYAGE (CL). Vous n'avez plus rien \u00E0 faire, passez la priorit\u00E9 chaque fois que le jeu vous la donne jusqu'au tour de l'adversaire.
msgTutPassTry=Appuyez sur OK chaque fois que le jeu attend une action de votre part, jusqu'au tour de l'adversaire.
msgTutPassWatch=Regardez : OK va \u00EAtre appuy\u00E9 tout au long de la fin de votre tour.
lblTutOppTurn=Le tour de votre adversaire
msgTutOppTurn=C'est maintenant au tour de votre adversaire. Il d\u00E9gage, fait son entretien, pioche une carte et joue un terrain. Puis son Brigand goblin (2/2) attaque, car il doit attaquer \u00E0 chaque combat.\n\nObservez les cases de phase ; elles s'allument \u00E0 mesure que le tour avance. Lorsqu'il sera temps de se d\u00E9fendre, le jeu vous demandera de d\u00E9clarer des bloqueurs.
msgTutOppTurnUnified=C'est maintenant au tour de votre adversaire. Il d\u00E9gage, fait son entretien, pioche une carte et joue un terrain. Puis son Brigand goblin (2/2) attaque, car il doit attaquer \u00E0 chaque combat.\n\nObservez l''\u00E9tiquette de phase ; elle change au cours du tour. Lorsqu''il sera temps de se d\u00E9fendre, le jeu vous demandera de d\u00E9clarer des bloqueurs.
# Step 5: block
lblTutNoAttack=Pas d'attaque cette fois
msgTutNoAttack=Votre adversaire n'a pas attaqu\u00E9, il n'y a donc rien eu \u00E0 bloquer. Quand il attaque, vous choisissez laquelle de vos cr\u00E9atures d\u00E9gag\u00E9es bloque quel attaquant.
lblTutBlock=\u00C9tape 5 sur 6 : Bloquer
msgTutBlock=Le Brigand goblin (2/2) vous attaque. C'est la phase de D\u00C9CLARATION DES BLOQUEURS (DB), et C'EST \u00C0 VOUS de choisir.\n\nBLOQUER consiste \u00E0 placer l'une de vos cr\u00E9atures d\u00E9gag\u00E9es sur le chemin de l'attaquant. Les deux s'affrontent et vous ne subissez aucun d\u00E9g\u00E2t. Le G\u00E9ant des collines est 3/3 : il subit 2 d\u00E9g\u00E2ts et survit (endurance 3), tandis que le Brigand subit 3 d\u00E9g\u00E2ts et meurt (endurance 2).
msgTutBlockTry=Cliquez sur le G\u00E9ant des collines brillant pour bloquer le Brigand, puis appuyez sur OK.
msgTutBlockWatch=Regardez : le G\u00E9ant des collines va \u00EAtre cliqu\u00E9 pour bloquer, puis OK sera appuy\u00E9.
lblTutBlocked=Bloqu\u00E9 !
msgTutBlocked=Lors des D\u00C9G\u00C2TS DE COMBAT, le G\u00E9ant des collines et le Brigand goblin se frappent simultan\u00E9ment. Le Brigand a subi 3 d\u00E9g\u00E2ts et a \u00E9t\u00E9 d\u00E9truit (all\u00E9 au CIMETI\u00C8RE). Le G\u00E9ant des collines a subi 2 d\u00E9g\u00E2ts mais a 3 d'endurance, il a donc surv\u00E9cu. Les d\u00E9g\u00E2ts s'effacent \u00E0 la fin du tour.
lblTutNotBlocked=Non bloqu\u00E9
msgTutNotBlocked=Vous avez subi {0} d\u00E9g\u00E2ts. Bloquer est optionnel, mais un bon blocage comme celui-ci pr\u00E9serve vos points de vie et peut d\u00E9truire l''attaquant.
# Step 6: win
lblTutWin=\u00C9tape 6 sur 6 : Gagner la partie
msgTutWin=C''est de nouveau votre tour : vous avez d\u00E9gag\u00E9 et pioch\u00E9 une carte. Votre adversaire a {0} points de vie. Attaquez avec toutes les cr\u00E9atures possibles ; la partie est gagn\u00E9e d\u00E8s que la vie d''un joueur atteint 0.\n\nPassez d''abord au combat.
lblTutAllAttack=Attaquer avec tout
msgTutAllAttack=Cliquez sur chaque cr\u00E9ature avec laquelle vous souhaitez attaquer, puis appuyez sur OK. L'adversaire n'a pas de cr\u00E9ature d\u00E9gag\u00E9e pour bloquer, tous les d\u00E9g\u00E2ts passent.
msgTutAllAttackTry=Cliquez sur les cr\u00E9atures brillantes (Goblin enrag\u00E9 et G\u00E9ant des collines), puis appuyez sur OK.
msgTutAllAttackWatch=Regardez : les deux cr\u00E9atures seront marqu\u00E9es comme attaquantes, puis OK sera appuy\u00E9.
lblTutNotQuite=Pas tout \u00E0 fait
msgTutNotQuite=Votre adversaire a surv\u00E9cu \u00E0 {0} points de vie. Passez le tour et attaquez \u00E0 nouveau.
lblTutYouWin=Vous avez gagn\u00E9 !
msgTutYouWinWatch=Voil\u00E0 une partie compl\u00E8te : jouer un terrain, lancer un sort et le payer, attaquer, bloquer et gagner.\n\nSur l'\u00E9cran suivant, choisissez \u00AB Essayer vous-m\u00EAme \u00BB pour jouer la m\u00EAme partie avec les cartes en surbrillance.
msgTutYouWinTry=Vous avez jou\u00E9 un terrain, lanc\u00E9 un sort et pay\u00E9 son co\u00FBt, attaqu\u00E9, bloqu\u00E9 et gagn\u00E9.\n\nA partir d'ici, tentez une vraie partie depuis l'\u00E9cran d'accueil. Vous pouvez toujours revenir dans Comment jouer.
# Phase notes (explained the first time the player has priority in them)
msgTutPhaseUpkeep=ENTRETIEN (UP) : premier arr\u00EAt du tour. Certaines cartes indiquent \u00AB au d\u00E9but de votre entretien \u00BB ; aucune ne s'applique ici.
msgTutPhaseDrawMine=PIOCHE (DR) : vous piocher une carte du dessus de votre biblioth\u00E8que.
msgTutPhaseDrawOpp=PIOCHE (DR) : votre adversaire pioche une carte du dessus de sa biblioth\u00E8que.
msgTutPhaseCombatBegin=D\u00C9BUT DU COMBAT (BC) : dernier moment pour agir avant le choix des attaquants.
msgTutPhaseCombatDamage=D\u00C9G\u00C2TS DE COMBAT (CD) : les attaquants et les bloqueurs infligent leurs d\u00E9g\u00E2ts en m\u00EAme temps.
msgTutPhaseCombatEnd=FIN DU COMBAT (EC) : le combat est termin\u00E9. Les cr\u00E9atures ayant attaqu\u00E9 restent engag\u00E9es.
msgTutPhaseMain2=PHASE PRINCIPALE 2 (M2) : seconde opportunit\u00E9 de jouer un terrain (si ce n'est pas fait) ou de lancer des sorts. On y lance souvent des cr\u00E9atures pour donner moins d'informations \u00E0 l'adversaire avant le blocage.
msgTutPhaseEnd=\u00C9TAPE DE FIN (ET) : les effets de \u00AB d\u00E9but de l'\u00E9tape de fin \u00BB se d\u00E9clenchent ici. Viens ensuite le NETTOYAGE (CL) : les d\u00E9g\u00E2ts sur les cr\u00E9atures s'effacent et les joueurs ayant plus de sept cartes en main se d\u00E9faussent pour revenir \u00E0 sept.