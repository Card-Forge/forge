advDifficultySummaryHard=Difficulty: {0}\nFor players who want a challenge.\nStarter decks will include 2-3 colors.\nStarting equipment: {1}
advDifficultySummaryInsane=Difficulty: {0}\nFor players who don''t want to like the game.\nIdentical to Hard difficulty, but with even less forgiving and rewarding results.\nStarter decks will include 2-3 colors.\nStarting equipment: {1}
