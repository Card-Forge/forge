advDifficultySummaryEasy=Difficulty: {0}\nFor newer players or those who want a relaxed experience.\nStarter decks are monocolored.\nStarting equipment: {1}
advDifficultySummaryNormal=Difficulty: {0}\nHow Adventure Mode is intended to be played.\nStarter decks will include a second color.\nStarting equipment: {1}
