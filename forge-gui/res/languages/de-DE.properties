advRewardItem7=riesiger Kartenordner
advRewardItem8=unsortierte Kiste mit Gemeingut
advRewardItem9=Eimer voller Bruchst\u00FCcke zerbrochener Artefakte
advRewardItem10=ersch\u00F6pfter Manasplitter
advQuestNotFinished=Du hast die letzte Aufgabe, die wir dir gestellt haben, noch nicht erledigt! ({0})
advQuestGoTakeCareOfThat=Oh, richtig, ich k\u00FCmmere mich darum.
advQuestComeBackTomorrow=Wir haben im Moment nichts Neues f\u00FCr dich. Komm morgen wieder.
advQuestNeedAssistance=Abenteurer, wir brauchen deine Hilfe!
advQuestLogFull=Das geht nicht, ich habe im Moment viel zu viel zu tun (Dein Questlog ist bereits zu voll) (Verlassen)
advRewardShopCardDisplayRatio=Verh\u00E4ltnis der Anzeige von Pr\u00E4mien-/Kundenkarten
advRewardShopCardTooltipRatio=Verh\u00E4ltnis der Tooltips f\u00FCr Pr\u00E4mien- und Shopkarten
advRedeemChallengeCoin=L\u00F6se eine Challenge Coin ein [+ChallengeCoin]
advRedeemSilverChallengeCoin=L\u00F6se eine Challenge Coin ein [+SilverChallengeCoin]
advRedeemBronzeChallengeCoin=L\u00F6se eine Challenge Coin ein [+BronzeChallengeCoin]
