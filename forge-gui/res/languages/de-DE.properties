advEventTypeBoosterDraft=Eventtyp: Booster Draft\n
advDraftPrizesDesc=Preise\n3 Rundensiege: 500 Gold\n2 Rundensiege: 200 Gold\n1 Rundensieg: 100 Gold\n
advJumpstartParticipationPrize=Die Teilnahme an diesem Event bringt Ihnen von jeder Karte Ihres Jumpstart-Decks ein wertloses Exemplar ein.
advSealedChampionPrize=Champion (3 Siege): Behalte deinen versiegelten Pool (alle {0} Booster)\n
advBonusEnemyDeckRewards=Bonusbelohnungen f\u00FCr das gegnerische Deck: +{0}\n
advDefaultDeclinedDialog=Komm morgen wieder, vielleicht habe ich dann etwas, was du tats\u00E4chlich tun m\u00F6chtest.
