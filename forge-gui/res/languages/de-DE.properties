# Start dialog
msgTutFinishMatchFirst=Beende oder verlasse dein aktuelles Spiel, bevor du das Tutorial startest.
msgTutIntro=Lerne die Grundlagen von Magic in einem kurzen \u00DCbungsspiel: Spiele ein Land, wirke einen Zauberspruch und bezahle ihn, greife an, blocke und gewinne.\n\nSieh dir zuerst die Demo an, in der jeder Zug erkl\u00E4rt wird, und w\u00E4hle dann \u201ESelbst ausprobieren\u201C, um dasselbe Spiel mit Hinweisen zu spielen.
btnTutWatchDemo=Demo ansehen
btnTutTryYourself=Selbst ausprobieren
msgTutStartError=Das Tutorial konnte nicht gestartet werden.\n{0}
# Win/lose screen labels
lblTutWatchAgain=Demo nochmal ansehen
lblTutPlayAgain=Erneut spielen
lblTutBackToMenu=Zur\u00FCck zum Men\u00FC
lblRestartPuzzle=R\u00E4tsel neustarten
lblQuitPuzzle=R\u00E4tsel beenden
# Generic notes
lblTutNeedHand=Brauchst du Hilfe?
lblTutKeepGoing=Weitermachen
lblTutNoProblem=Kein Problem
msgTutNoProblem=Durch das Abbrechen wird der Zauberspruch zur\u00FCck auf deine Hand gelegt. Wirke ihn erneut.
lblTutRestart=Versuchen wir das noch einmal
msgTutRestart={0}\n\nDas \u00DCbungsspiel startet wieder von vorne.
lblTutDesync=Die Demo ist nicht mehr synchron
msgTutDesync=Etwas Unerwartetes ist passiert, daher stoppt die Demo hier. Du kannst unter \u201ESpielanleitung\u201C weiterhin \u201ESelbst ausprobieren\u201C w\u00E4hlen.
lblTutPhaseOpp={0} (Zug des Gegners)
msgTutWaitHint=Der Zug deines Gegners l\u00E4uft. Dr\u00FCcke OK, wann immer das Spiel danach fragt.
# Board tour
lblTutTourTitle=Spielfeld-Tour
btnTutTourShow=Tour anzeigen
btnTutTourSkip=\u00DCberspringen
msgTutTour6Watch=Jetzt beginnt die Demo. Jeder Hinweis wird zuerst angezeigt und nichts bewegt sich, bis du Weiter dr\u00FCckst. Nimm dir also Zeit. Dann zeigt die Demo auf die Karte, klickt sie f\u00FCr dich an und erkl\u00E4rt, was sich ver\u00E4ndert hat.\n\nW\u00E4hrend die Demo l\u00E4uft, sind deine eigenen Klicks auf Karten und die Schaltfl\u00E4chen OK / Zug beenden pausiert, damit nichts aus dem Takt ger\u00E4t. Nutze Weiter und Ausblenden, falls eine Notiz etwas verdeckt, das du sehen m\u00F6chtest.
msgTutTour6Try=Jetzt bist du an der Reihe zu spielen. Bei jedem Schritt leuchtet die anzuklickende Karte auf und sagt dir, was zu tun ist.
# Step 1: land
lblTutLand=Schritt 1 von 6: Spiele ein Land
msgTutLand=Es ist deine HAUPTPHASE 1 (M1). Dies ist der Zeitpunkt, an dem du ein Land spielst und Zauberspr\u00FCche wirkst.\n\nL\u00E4nder erzeugen Mana, die Ressource, die du f\u00FCr Zauberspr\u00FCche ausgibst. Du darfst PRO Zug EIN Land spielen, und zwar nur in einer Hauptphase.
msgTutLandTry=Klicke auf das leuchtende Gebirge in deiner Hand, um es zu spielen.
msgTutLandWatch=Schau zu: Das Gebirge in deiner Hand wird angeklickt, um es zu spielen.
msgTutLandMissed=Du hast deine Hauptphase beendet, ohne ein Land zu spielen, daher steht kein Mana f\u00FCr den n\u00E4chsten Schritt zur Verf\u00FCgung.
lblTutLandDone=Dein Gebirge ist im Spiel
msgTutLandDone=Das Gebirge wurde von deiner HAND auf das SPIELFELD bewegt.\n\nL\u00E4nder enttappen zu Beginn jedes deiner Z\u00FCge. Das TAPPEN eines Landes (zur Seite drehen) erzeugt ein Mana; ein Gebirge erzeugt rotes Mana. Du hast dein Land f\u00FCr diesen Zug gespielt.
# Step 2: cast
lblTutCast=Schritt 2 von 6: Wirke einen Zauberspruch
msgTutCast=Zauberspr\u00FCche kosten Mana, was in der oberen Ecke der Karte angezeigt wird. W\u00FCtender Goblin kostet '{'R'}' : ein rotes Mana, das das Gebirge erzeugt, das du gerade gespielt hast.\n\nKreaturenzauber werden auf dieselbe Weise gewirkt wie L\u00E4nder gespielt werden: indem du sie auf deiner Hand anklickst.
msgTutCastTry=Klicke auf den leuchtenden W\u00FCtenden Goblin in deiner Hand.
msgTutCastWatch=Schau zu: Der W\u00FCtende Goblin in deiner Hand wird angeklickt, um ihn zu wirken.
msgTutCastMissed=Der Zauberspruch wurde in diesem Zug nicht gewirkt.
lblTutPay=Bezahle das Mana
msgTutPay=Das Wirken erfordert das Bezahlen der Kosten. Du bezahlst, indem du L\u00E4nder f\u00FCr Mana TAPPT. Das Tappen des Gebirges erzeugt '{'R'}', was die gesamten Kosten deckt und den Zauberspruch auf den Stapel legt.
msgTutPayTry=Klicke auf das leuchtende Gebirge auf deinem Spielfeld, um es f\u00FCr rotes Mana zu tappen.
msgTutPayWatch=Schau zu: Das Gebirge wird angeklickt, um es f\u00FCr rotes Mana zu tappen.
lblTutStack=Der Stapel
msgTutStack=Dein W\u00FCtender Goblin ist noch nicht im Spiel. Zauberspr\u00FCche warten zuerst auf dem STAPEL (siehe Registerkarte Stapel), damit dein Gegner die Chance hat zu reagieren. Wenn beide Spieler hintereinander passen, wird der oberste Zauberspruch verrechnet.\n\nDu hast jetzt Priorit\u00E4t, was bedeutet, dass du erneut handeln kannst. Da du nichts weiter zu tun hast, passe.
msgTutStackTry=Dr\u00FCcke OK, um die Priorit\u00E4t zu passen und deinen Zauberspruch verrechnen zu lassen.
msgTutStackWatch=Schau zu: OK wird gedr\u00FCckt, um den Zauberspruch verrechnen zu lassen.
lblTutResolved=W\u00FCtender Goblin verrechnet
msgTutResolved=Er hat den Stapel verlassen und das SPIELFELD betreten. Er ist eine 1/1-Kreatur: St\u00E4rke 1, Widerstandskraft 1.\n\nEine Kreatur, die gerade angekommen ist, kann normalerweise erst in deinem n\u00E4chsten Zug angreifen (\u201EEinsatzverz\u00F6gerung\u201C). W\u00FCtender Goblin hat EILE, wodurch diese Wartezeit \u00FCbersprungen wird und er sofort angreifen kann.
# Step 3: attack
lblTutAttack=Schritt 3 von 6: Greife an!
msgTutAttack=Der Kampf ist die M\u00F6glichkeit, deinem Gegner Schaden zuzuf\u00FCgen. Er besteht aus mehreren Phasen: BEGINN DES KAMPFES (BC), ANGREIFER DEKLARIEREN (DA), BLOCKER DEKLARIEREN (DB), KAMPFSCHADEN (CD) und ENDE DES KAMPFES (EC).\n\nVerlasse zuerst deine Hauptphase und gehe in den Kampf \u00FCber.
msgTutToCombatTry=Dr\u00FCcke OK, um zum Kampf \u00FCberzugehen.
msgTutToCombatWatch=Schau zu: OK wird gedr\u00FCckt, um zum Kampf \u00FCberzugehen.
lblTutDeclare=Angreifer deklarieren
msgTutDeclare=Dies ist die Phase ANGREIFER DEKLARIEREN (DA): Du w\u00E4hlst aus, welche Kreaturen angreifen. Klicke auf eine Kreatur, um sie zu markieren, und dr\u00FCcke dann OK.\n\nEine angreifende Kreatur TAPPT (dreht sich zur Seite) und kann bis zu deinem n\u00E4chsten Zug nicht blocken. Deshalb bleibt der H\u00FCgelriese zu Hause: Er wird dich sp\u00E4ter verteidigen.
msgTutDeclareTry=Klicke auf den leuchtenden W\u00FCtenden Goblin und dr\u00FCcke dann OK.
msgTutDeclareWatch=Schau zu: Der W\u00FCtende Goblin wird als Angreifer markiert, danach wird OK gedr\u00FCckt.
lblTutDamage=Kampfschaden
msgTutDamageDealt=Dein Gegner hatte keine Kreatur, die blocken konnte, daher war der W\u00FCtende Goblin ungeblockt und hat {0} Schaden zugef\u00FCgt. Dein Gegner hat noch {1} Lebenspunkte.\n\nDer Goblin bleibt bis zu deinem n\u00E4chsten Enttappsegment getappt (zur Seite gedreht).
msgTutCombatOver=Der Kampf ist vorbei.
# Step 4: end the turn
lblTutPass=Schritt 4 von 6: Beende deinen Zug
msgTutPass=Nach dem Kampf erh\u00E4ltst du die HAUPTPHASE 2 (M2), eine zweite Chance, ein Land zu spielen oder Zauberspr\u00FCche zu wirken; danach folgen das ENDSEGMENT (ET) und das AUFR\u00C4UMSEGMENT (CL). Du hast nichts mehr zu tun, also passe jedes Mal die Priorit\u00E4t, wenn das Spiel sie dir gibt, bis der Zug deines Gegners beginnt.
msgTutPassTry=Dr\u00FCcke jedes Mal OK, wenn das Spiel auf dich wartet, bis der Zug deines Gegners beginnt.
msgTutPassWatch=Schau zu: OK wird f\u00FCr den Rest deines Zuges gedr\u00FCckt.
lblTutOppTurn=Der Zug deines Gegners
msgTutOppTurn=Jetzt ist dein Gegner am Zug. Er enttappt, f\u00FChrt das Entsinnen aus, zieht eine Karte und spielt ein Land. Dann greift sein Goblin-R\u00E4uber (2/2) an, da er in jedem Kampf angreifen muss.\n\nBeobachte die Phasen-K\u00E4stchen; sie leuchten im Laufe des Zuges auf. Wenn es Zeit ist sich zu verteidigen, fordert dich das Spiel auf, Blocker zu deklarieren.
msgTutOppTurnUnified=Jetzt ist dein Gegner am Zug. Er enttappt, f\u00FChrt das Entsinnen aus, zieht eine Karte und spielt ein Land. Dann greift sein Goblin-R\u00E4uber (2/2) an, da er in jedem Kampf angreifen muss.\n\nBeobachte das Phasen-Label; es \u00E4ndert sich im Laufe des Zuges. Wenn es Zeit ist sich zu verteidigen, fordert dich das Spiel auf, Blocker zu deklarieren.
# Step 5: block
lblTutNoAttack=Diesmal kein Angriff
msgTutNoAttack=Dein Gegner hat nicht angegriffen, daher gab es nichts zu blocken. Wenn er angreift, w\u00E4hlst du aus, welche deiner ungetappten Kreaturen welchen Angreifer blockt.
lblTutBlock=Schritt 5 von 6: Blocken
msgTutBlock=Der Goblin-R\u00E4uber (2/2) greift dich an. Dies ist die Phase BLOCKER DEKLARIEREN (DB), und jetzt w\u00E4hlst DU.\n\nBLOCKEN bedeutet, eine deiner ungetappten Kreaturen dem Angreifer in den Weg zu stellen. Die beiden k\u00E4mpfen gegeneinander und du erleidest keinen Schaden. Der H\u00FCgelriese ist 3/3: Er erleidet 2 Schaden und \u00FCberlebt (Widerstandskraft 3), w\u00E4hrend der R\u00E4uber 3 Schaden erleidet und stirbt (Widerstandskraft 2).
msgTutBlockTry=Klicke auf den leuchtenden H\u00FCgelriesen, um den R\u00E4uber zu blocken, und dr\u00FCcke dann OK.
msgTutBlockWatch=Schau zu: Der H\u00FCgelriese wird angeklickt, um zu blocken, danach wird OK gedr\u00FCckt.
lblTutBlocked=Geblockt!
msgTutBlocked=Im KAMPFSCHADEN f\u00FCgen sich der H\u00FCgelriese und der Goblin-R\u00E4uber gleichzeitig Schaden zu. Der R\u00E4uber erlitt 3 Schaden und wurde zerst\u00F6rt (er ging auf den FRIEDHOF). Der H\u00FCgelriese erlitt 2 Schaden, hat aber 3 Widerstandskraft und \u00FCberlebte daher. Schaden l\u00E4sst am Ende des Zuges nach.
lblTutNotBlocked=Nicht geblockt
msgTutNotBlocked=Du hast {0} Schaden erlitten. Blocken ist optional, aber ein guter Block wie dieser rettet Lebenspunkte und kann den Angreifer zerst\u00F6ren.
# Step 6: win
lblTutWin=Schritt 6 von 6: Gewinne das Spiel
msgTutWin=Du bist wieder am Zug: Du hast enttappt und eine Karte gezogen. Dein Gegner hat {0} Lebenspunkte. Greife mit jeder Kreatur an, die du kannst; das Spiel ist gewonnen, wenn die Lebenspunkte eines Spielers 0 erreichen.\n\nGehe zuerst zum Kampf \u00FCber.
lblTutAllAttack=Mit allem an greifen
msgTutAllAttack=Klicke auf jede Kreatur, mit der du angreifen m\u00F6chtest, und dr\u00FCcke dann OK. Dein Gegner hat keine ungetappten Kreaturen zum Blocken, daher geht der gesamte Schaden durch.
msgTutAllAttackTry=Klicke auf die leuchtenden Kreaturen (W\u00FCtender Goblin und H\u00FCgelriese) und dr\u00FCcke dann OK.
msgTutAllAttackWatch=Schau zu: Beide Kreaturen werden als Angreifer markiert, danach wird OK gedr\u00FCckt.
lblTutNotQuite=Nicht ganz
msgTutNotQuite=Dein Gegner hat mit {0} Lebenspunkten \u00FCberlebt. Beende den Zug und greife erneut an.
lblTutYouWin=Du gewinnst!
msgTutYouWinWatch=Das ist ein ganzes Spiel: Spiele ein Land, wirke einen Zauberspruch und bezahle ihn, greife an, blocke und gewinne.\n\nW\u00E4hle im n\u00E4chsten Bildschirm \u201ESelbst ausprobieren\u201C, um dasselbe Spiel mit hervorgehobenen Karten zu spielen.
msgTutYouWinTry=Du hast ein Land gespielt, einen Zauberspruch gewirkt und bezahlt, angegriffen, geblockt und gewonnen.\n\nVersuche von hier aus ein echtes Match vom Hauptbildschirm aus. Du kannst jederzeit zur Spielanleitung zur\u00FCckkehren.
# Phase notes (explained the first time the player has priority in them)
msgTutPhaseUpkeep=ENTSINNEN (UP): Der erste Stopp des Zuges. Einige Karten besagen \u201Ezu Beginn deines Entsinnen-Segments\u201C; hier spielt das keine Rolle.
msgTutPhaseDrawMine=ZIEHEN (DR): Du ziehst eine Karte oben von deiner Bibliothek.
msgTutPhaseDrawOpp=ZIEHEN (DR): Dein Gegner zieht eine Karte oben von seiner Bibliothek.
msgTutPhaseCombatBegin=BEGINN DES KAMPFES (BC): Die letzte Gelegenheit zu handeln, bevor Angreifer gew\u00E4hlt werden.
msgTutPhaseCombatDamage=KAMPFSCHADEN (CD): Angreifer und Blocker f\u00FCgen ihren Schaden gleichzeitig zu.
msgTutPhaseCombatEnd=ENDE DES KAMPFES (EC): Der Kampf ist vorbei. Kreaturen, die angegriffen haben, bleiben getappt.
msgTutPhaseMain2=HAUPTPHASE 2 (M2): Eine zweite Chance, ein Land zu spielen (falls noch nicht geschehen) oder Zauberspr\u00FCche zu wirken. Spieler wirken Kreaturen oft hier, damit der Gegner vor dem Blocken weniger Informationen hatte.
msgTutPhaseEnd=ENDSEGMENT (ET): Effekte f\u00FCr \u201Ezu Beginn des Endsegments\u201C werden hier ausgel\u00F6st. Als N\u00E4chstes folgt das AUFR\u00C4UMSEGMENT (CL): Schaden auf Kreaturen l\u00E4sst nach, und ein Spieler mit mehr als sieben Karten auf der Hand wirft auf sieben ab.