lblSummary=Zusammenfassung
advModeStandardSummary=Modus: Standard\n\nDein Startdeck besteht aus 2-3 Jumpstart-Packs mit je zwanzig Karten.\n\n
advDiffEasyStandard=Bei dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201EEinfach\u201C erhalten Sie drei Jumpstart-Pakete in der von Ihnen gew\u00E4hlten Farbe.
advDiffNormalStandard=Auf dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201ENormal\u201C erhalten Sie zwei Jumpstart-Pakete in Ihrer gew\u00E4hlten Farbe und eines in einer verb\u00FCndeten Farbe.
advDiffHardStandard=Auf dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201ESchwer\u201C erh\u00E4ltst du ein Jumpstart-Paket in deiner gew\u00E4hlten Farbe und eines in einer verb\u00FCndeten Farbe.
advDiffInsaneStandard=Auf dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201EWahnsinnig\u201C erh\u00E4ltst du ein Jumpstart-Paket in deiner gew\u00E4hlten Farbe und eines in einer verb\u00FCndeten Farbe.
advCannotDetermineStarterDeck=((Das Starterdeck kann aufgrund der benutzerdefinierten Schwierigkeitseinstellungen nicht bestimmt werden.))
advModeConstructedSummary=Modus: Konstruiert\n\nDu erh\u00E4ltst ein bestimmtes, vorgefertigtes Deck, das auf deiner gew\u00E4hlten Farbe und Schwierigkeitsstufe basiert.\n\n
advDiffEasyConstructed=Bei dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201EEinfach\u201C enth\u00E4lt Ihr Kartenstapel nur die von Ihnen gew\u00E4hlte Farbe.
advDiffNormalConstructed=Bei dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201ENormal\u201C enth\u00E4lt dein Deck deine gew\u00E4hlte Farbe und eine verb\u00FCndete Farbe.
advDiffHardConstructed=Bei dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201ESchwer\u201C enth\u00E4lt Ihr Deck Ihre gew\u00E4hlte Farbe und eine gegnerische Farbe.
advDiffInsaneConstructed=Auf dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201EWahnsinnig\u201C enth\u00E4lt dein Deck deine gew\u00E4hlte Farbe und eine gegnerische Farbe.
advModePileSummary=Modus: Stapel\n\nSie erhalten einen zuf\u00E4lligen Stapel Karten, basierend auf Ihrer gew\u00E4hlten Farbe und Schwierigkeit.\n\n
advDiffEasyPile=Bei dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201EEinfach\u201C enth\u00E4lt Ihr Deck nur Ihre gew\u00E4hlte Farbe und eine verb\u00FCndete Farbe.
advDiffNormalPile=Auf dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201ENormal\u201C enth\u00E4lt dein Deck deine gew\u00E4hlte Farbe und zwei verb\u00FCndete Farben.
advDiffHardPile=Auf dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201ESchwer\u201C enth\u00E4lt dein Deck deine gew\u00E4hlte Farbe und zwei verb\u00FCndete Farben.\n\n
advDiffInsanePile=Auf dem aktuell gew\u00E4hlten Schwierigkeitsgrad \u201EWahnsinnig\u201C enth\u00E4lt dein Deck deine gew\u00E4hlte Farbe und zwei verb\u00FCndete Farben.\n\n
advPileLessRareReward=Sie erhalten weniger ungew\u00F6hnliche und seltene Karten als im normalen Schwierigkeitsgrad.
advModeChaosSummary=Modus: Chaos\n\nDu (und alle Gegner) erhaltet ein zuf\u00E4llig zusammengestelltes Deck.\n\nWarnung: Dadurch kann der Schwierigkeitsgrad der Begegnungen stark von der Absicht der Entwickler abweichen.
advModeCustomGeneticSummary=Modus: Benutzerdefiniert\n\nW\u00E4hle dein eigenes vorgefertigtes Deck. Gegner k\u00F6nnen ein zuf\u00E4llig generiertes KI-Deck erhalten (schwierig).\n\nWarnung: Dadurch kann der Schwierigkeitsgrad der Begegnungen stark von der Absicht der Entwickler abweichen.
advModeCustomSummary=Modus: Benutzerdefiniert\n\nW\u00E4hle dein eigenes vorgefertigtes Deck.
advModePreconSummary=Modus: Vorkonfiguriert\n\nSie erhalten ein bestimmtes vorkonfiguriertes Deck. Sie k\u00F6nnen ein zuf\u00E4lliges oder ein bestimmtes vorkonfiguriertes Deck aus einer Edition Ihrer Wahl ausw\u00E4hlen.\n\n
advModeCommanderSummary=Modus: Commander\n\nZu Beginn des Spiels erh\u00E4ltst du ein vorgefertigtes Commander-Deck basierend auf dem gew\u00E4hlten Farbthema.\n\nViel Gl\u00FCck bei deiner Mission, ein stimmiges Deck zu erstellen, mit dem du regelm\u00E4\u00DFig gewinnen und die Bosse besiegen kannst.
advModeCommanderPreconSummary=Modus: Commander Precon\n\nW\u00E4hle ein benanntes, vorgefertigtes Commander-Deck, um das Spiel zu starten.\n\nHierbei werden die Commander-Deckbau- und Spielregeln verwendet, du kannst aber aus dem kuratierten Commander-Precon-Ordner ausw\u00E4hlen.
advNoModeSummaryAvailable=F\u00FCr diesen Spielmodus ist keine Zusammenfassung verf\u00FCgbar.
advRewardItem1=Sammlung h\u00E4ufig gestellter Fragen
advRewardItem2=Schachtel mit Kartenh\u00FCllen
advRewardItem3=geliebte Spielmatte
advRewardItem4=Exemplar von Richard Garfields Autobiografie
advRewardItem5=Sammlung zuf\u00E4lliger Fremdsprachenkarten
