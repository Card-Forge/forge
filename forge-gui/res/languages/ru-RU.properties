nlServerPort=Задаёт номер порта, на котором Forge будет хостить сервер.
lblAfkTimeout=Тайм-аут неактивности (минуты)
nlAfkTimeout=Количество минут бездействия, после которого игрок автоматически передаёт приоритет. Применяется только к решениям о приоритете — на другие запросы (боевые повреждения, диалоги) это не влияет. Установите 0, чтобы отключить.
lblAfkTimeoutChat=Тайм-аут неактивности: {0}
lblAfkTimeoutDisabled=Тайм-аут неактивности: отключён
lblAfkWarning={0} автоматически пропустит ход через 30 секунд из-за бездействия (тайм-аут неактивности: {1}).
lblAfkAutoPass={0} автоматически пропустил ход из-за бездействия (тайм-аут неактивности: {1}, теперь будет автоматически пропускать через 10 сек. на каждом приоритете до возвращения активности).
sOPAfkTimeoutPromptTitle=Тайм-аут неактивности
sOPAfkTimeoutPromptMessage=Введите тайм-аут неактивности в минутах (0 — отключить, максимум 60):
sOPAfkTimeoutPromptError=Неверное значение ''{0}''. Введите целое число от 0 до 60.
lblPlayerName=Имя игрока
nlPlayerName=Задаёт имя, под которым вас будет называть Forge во время игры.
nlCompactMainMenu=Включите для компактной боковой панели, отображающей только одну группу меню за раз (ТРЕБУЕТСЯ ПЕРЕЗАПУСК).
nlUseSentry=Если включено, автоматически отправляет отчёты об ошибках разработчикам.
GamePlay=Игровой процесс
nlpMulliganRule=Выберите версию правила маллигана
nlpSoundSets=Выберите набор звуков из тех, что находятся в папке "sound" в каталоге кэша Forge
nlpMusicSets=Выберите набор музыки из тех, что находятся в папке "music" в каталоге кэша Forge
nlpAiProfiles=Выберите вашего ИИ-противника
nlpStackAdditions=Выберите, когда получать визуальные уведомления о добавлении эффекта на стек: никогда, всегда или только для эффектов, разыгранных/активированных ИИ-игроком или вызванных срабатыванием триггера любым игроком
nlAnte=Определяет, играется ли партия на ставку (анте).
nlAnteMatchRarity=Пытается сделать ставки одинаковой редкости для всех игроков.
nlAnteIncludeBasicLands=Разрешает выбирать базовые земли для ставки, в соответствии с оригинальными правилами бумажной Magic.
nlEnableAICheats=Разрешить ИИ жульничать ради преимущества (для профилей с настроенным жульничеством при тасовке).
nlManaBurn=Играть с ожогом маной (правило из эпохи до Magic 2010).
nlOrderCombatants=Играть со старым порядком участников боя (правило из периода от Magic 2010 до Foundations).
nlManaLostPrompt=Если включено, вы получите предупреждение, если передача приоритета приведёт к потере маны из вашего резерва маны.
nlEnforceDeckLegality=Обеспечивает соответствие колоды правилам для каждого формата (минимальный размер колоды, максимальное число карт и т.д.).
nlpAiSideboardingMode=Выберите способ сайдбординга ИИ: Выкл. (ИИ не сайдбордит), ИИ (ИИ сайдбордит сам за себя, в основном случайным образом), Игрок за ИИ (игрок-человек сайдбордит за ИИ в конструированных форматах).
nlExperimentalRestore=ЭКСПЕРИМЕНТАЛЬНО — сохраняет снимок состояния для отмены заклинаний или способностей
nlPerformanceMode=Отключает дополнительные проверки статических способностей для ускорения игрового движка. (Внимание: нарушает некоторые сценарии «как если бы имела вспышку» при розыгрыше карт, принадлежащих противникам).
nlOrderHand=Упорядочивать руку по мана-стоимости и цвету
nlFilteredHands=Генерирует две стартовые руки и оставляет ту, где число земель ближе всего к среднему для колоды. (ТРЕБУЕТСЯ ПЕРЕЗАПУСК)
nlCloneImgSource=Если включено, клоны будут использовать своё оригинальное изображение вместо изображения скопированной карты.
nlPauseWhileMinimized=Если включено, Forge приостанавливается при сворачивании (в основном для боёв ИИ против ИИ).
nlEscapeEndsTurn=Если включено, клавиша Escape служит альтернативной клавишей завершения текущего хода.
nlDetailedPaymentDesc=Если включено, при выборе целей и оплате стоимости отображаются подробные описания заклинаний/способностей.
nlGrayText=Если включено, текст способности с невыполненными условиями будет затенён на панелях с подробностями карты.
nlShowStormCount=Если включено, отображает текущий счётчик шторма на панели запроса.
nlRemindOnPriority=Если включено, область выбора игрока мигает при получении приоритета.
nlpGraveyardOrdering=Определяет, когда разрешать игроку выбирать порядок карт, одновременно попадающих на кладбище (никогда, всегда, или только при использовании карт, для которых это важно, например, Volrath''s Shapeshifter).
nlpAutoDecisionMode=Как долго сохраняются решения автопропуска и «Всегда да/нет» для триггеров: для карты (одна игра) или для способности (этот матч, эта сессия или все сессии).
RandomDeckGeneration=Генерация случайной колоды
nlRemoveSmall=Отключает существ 1/1 и 0/X в сгенерированных колодах
nlSingletons=Отключает дубликаты не-земель в сгенерированных колодах
nlRemoveArtifacts=Отключает карты артефактов в сгенерированных колодах
nlCardBased=Создаёт более синергичные случайные колоды (ТРЕБУЕТСЯ ПЕРЕЗАПУСК)
DeckEditorOptions=Настройки редактора колод
nlFilterLandsByColorId=При использовании фильтров по цвету карт фильтровать земли так, чтобы было легче находить нужные земли, производящие ману.
AdvancedSettings=Дополнительные настройки
nlDevMode=Включает меню с функциями для тестирования во время разработки.
nlWorkshopSyntax=Включает проверку синтаксиса скриптов карт в мастерской. Примечание: функция всё ещё находится на стадии тестирования!
nlGameLogEntryType=Изменяет объём информации, отображаемой в журнале игры. «Низкий» показывает ходы и повреждения, «Средний» добавляет заклинания и бой, «Высокий» показывает всё. «Особый» позволяет выбрать отдельные категории.
nlCloseAction=Изменяет действие при нажатии кнопки X в правом верхнем углу.
nlLoadCardsLazily=Если включено, Forge будет загружать скрипты карт по мере необходимости, а не при запуске. (ОТКЛЮЧЕНО: ВЫЗЫВАЕТ ПРОБЛЕМЫ)
nlLoadArchivedFormats=Если включено, Forge загрузит все определения архивных форматов, что может немного увеличить время запуска. (ТРЕБУЕТСЯ ПЕРЕЗАПУСК)
GraphicOptions=Графические настройки
nlCardArtFormat=Формат изображений карт. (Полное: изображение всей карты. Обрезанное: только часть с иллюстрацией)
nlDefaultFontSize=Размер шрифта по умолчанию в интерфейсе. Все элементы шрифта масштабируются относительно этого значения. (ТРЕБУЕТСЯ ПЕРЕЗАПУСК)
cbpMulliganRule=Правило маллигана
nlImageFetcher=Включает загрузку недостающих изображений карт из онлайн-источника в реальном времени.
nlDisplayFoil=Отображает фольгированные карты с визуальным эффектом фольги.
nlRandomFoil=Добавляет эффект фольги случайным картам.
nlScaleLarger=Позволяет увеличивать изображения карт больше их исходного размера.
nlRenderBlackCardBorders=Отображать чёрные рамки вокруг изображений карт.
nlShowActionableHighlights=Показывать обводку на картах, которые вы сейчас можете разыграть или активировать.
nlShowAutoTapPreview=Показывать подсветку карт, которые автовыбор повернёт для оплаты текущей стоимости маны.
nlShowLinkedExileCards=Показывает полупрозрачную информационную копию карт, которые перманент удерживает в изгнании, например, подготовленные заклинания или карты, изгнанные до тех пор, пока перманент не покинет поле битвы, как Banishing Light. Реальные карты остаются в зоне изгнания.
