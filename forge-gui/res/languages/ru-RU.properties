  ваш список колоды. \n {0}
lblGuideTipsTitleCount=Количество карт
lblGuideTipsCount={0}: добавьте в начало каждой строки с картой количество копий для импорта (по умолчанию: 1). \n\
  Например, приняты записи как {1}, так и {2}.
lblGuideTipsTitleSet=Иллюстрация карты
lblGuideTipsSet={0}: укажите код сета M:TG (непосредственно перед или после названия карты), чтобы выбрать \
  конкретную иллюстрацию карты. Также добавьте коллекционный номер карты или индекс иллюстрации в конце строки, если у выбранного \
  сета есть несколько иллюстраций для одной и той же карты (см. дополнительные примеры ниже).
lblGuideTipsTitleFoil=Фольгированные карты
lblGuideTipsFoil={0}: любое название карты, заканчивающееся знаком "+", будет импортировано как фольгированное, например {1}. Также \
  добавление символа {2} в конце строки карты (как это принято в некоторых форматах колод M:TG) даст \
  тот же результат (см. раздел с примерами ниже).
lblGuideTipsTitlePlaceholder=Группы карт
lblGuideTipsPlaceholder={0}: для организации списка карт можно использовать специальные ключевые слова-заполнители. Это могут быть \
  основные типы карт (например, {1}), редкость карт (то есть {2}), мана-стоимость (например, {3}) или цвета маны (например, {4}).
lblGuideTipsTitleDeckSections=Разделы колоды
lblGuideTipsDeckSection={0}: подобно группам карт, список карт также можно организовать по разделам колоды \
  (например, {1}), которые также будут использоваться Импортёром для распределения карт по колоде (по умолчанию: {2}). \
  По этой причине Импортёр также включает автоматическую проверку карт в разделах, чтобы \
  снизить риск ошибок.
lblGuideTipsTitleDeckName=Название колоды
lblGuideTipsDeckName={0}: присвойте имя вашей колоде. Просто введите "Deck:" или "Name:", а затем название, \
  которое нужно присвоить колоде.
lblGuideTipsTitleDeckFormat=Форматы колод
lblGuideTipsDeckFormats={0}: поддерживается несколько форматов колод M:TG: MTG Arena; \
  MTGO, XMage, MTG Goldfish (все варианты экспорта); TappedOut (все варианты экспорта, кроме CSV); DeckStats.net; файлы ".dec".
nlGuideExamplesTitle=Примеры
lblExample1=10x Islands+ MIR 2
nlExample1=10 ФОЛЬГИРОВАННЫХ «Island» из сета «Mirage», индекс иллюстрации 2\.
lblExample2=4 Darksteel Citadel (M15) 242
nlExample2=4 «Darksteel Citadel» из «M15», номер коллекции «242».\n\n \
  Это пример записи в формате MTGArena, экспортированном TappedOut.
lblExample3=18 Forest &lt;254&gt; [THB] (F)
nlExample3=18 ФОЛЬГИРОВАННЫХ «Forest» из «THB», номер коллекции «254».\n\n \
  Это пример записи в формате колоды MTGArena, экспортированном MTGGoldfish. \
  Символы "(F)" в конце обозначают фольгированную карту, а номер коллекции в угловых скобках \
  используется для выбора конкретной иллюстрации карты).
lblExample4=4x TMP|Counterspell
nlExample4=4 копии «Counterspell» из «Tempest».\n\n \
  В этой записи код сета указан перед названием карты с использованием (необязательного) разделителя-вертикальной черты.\
  Альтернативные допустимые разделители для кодов сетов — фигурные скобки, квадратные скобки и круглые скобки.
lblExample5=SB: 2 [M19:28] Mighty Leap
nlExample5=2 копии «Mighty Leap» из «M19», номер коллекции «28», которые будут добавлены в «Сайдборд».\n\n \
  Это пример записи в формате колоды XMage. В этом формате код сета и номер коллекции \
  разделены двоеточием и указываются в квадратных скобках непосредственно перед названием карты. \
  Кроме того, необязательный префикс (то есть SB:) используется для обозначения раздела колоды, в который следует добавить карту. \
  Импортёр колод в Forge развивает эту идею, добавляя поддержку ещё двух префиксов, а именно "MB:" и \
  "CM:" — для разделов "Main" (основная колода) и "Commander" (командир) соответственно.
