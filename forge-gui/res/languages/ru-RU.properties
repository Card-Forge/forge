nlPrefArtExpansionOnly=По возможности предпочитать изображения карт из базовых, дополнительных и переизданных наборов (например, без промо-карт и онлайн-изданий).
lblAutoAIDeck=Включить автоматический выбор колоды для ИИ
nlAutoAIDeck=Если включено, при нажатии «Случайная колода» для ИИ-игрока будут автоматически выбираться совместимые с ИИ колоды (при проблемах с производительностью отключите эту опцию).
lblSmartCardArtOpt=Включить умный выбор изображений карт в колодах
nlSmartCardArtOpt=Если включено, изображения карт в колодах будут автоматически подбираться в соответствии с рамками карт, изданиями и различными вариантами иллюстраций.
nlSmartCardArtOptNote=ПРИМЕЧАНИЕ: эта опция влияет только на карты без указанного издания. Остальные карты останутся без изменений. (Внимание: экспериментальная функция)
