nlGuideQuickInstructions=Чтобы начать использовать Импортёр колод, просто введите или вставьте названия \
  карт, которые вы хотите добавить, в Список карт (по одной на строку). Список карт может содержать как несколько отдельных карт, \
  так и полную колоду в одном из самых популярных форматов M:TG (см. ниже список поддерживаемых форматов колод). \n \
  Каждая строка в Списке карт обрабатывается сразу, и любая распознанная запись появится в Списке колоды одним \
  из следующих цветов: {0}
