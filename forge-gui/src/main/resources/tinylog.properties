writerdefault        = console
writerdefault.level  = info
writerdefault.format = {date: HH:mm:ss} [{level|min-size=5}] {class-name}: {message}

# Suppress noisy libraries (they flood at DEBUG/TRACE)
level@io.netty           = warn
level@org.jupnp          = warn
level@org.eclipse.jetty  = warn

# Network file writer - routes to per-instance files via thread context
writerNetFile        = network log
writerNetFile.tag    = NETWORK
writerNetFile.level  = trace
writerNetFile.format = {date: HH:mm:ss.SSS} [{level|min-size=5}] {class-name}: {message}{exception}

# AI decision log (opt-in): the heuristic AI's opinion of every candidate play, the play it
# chooses and its attack reasoning, on the AI tag. Off by default. Enable with
# -Dforge.ai.log=trace (every candidate) or =debug (choices and attacks only); add
# -Dforge.ai.log.writer=file to write ai-decisions.log instead of the console.
writerAi        = #{forge.ai.log.writer:console}
writerAi.tag    = AI
writerAi.level  = #{forge.ai.log:off}
writerAi.file   = ai-decisions.log
writerAi.append = true
writerAi.format = {date: HH:mm:ss.SSS} [{level|min-size=5}] {message}
