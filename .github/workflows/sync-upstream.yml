name: Sync upstream forge

on:
  # Daily 06:00 Paris time. GitHub cron is UTC only and cannot express DST:
  # 04:00 UTC = 06:00 CEST (summer), 05:00 local in winter. Deliberately not
  # push-triggered — daily freshness is enough, see commit for rationale.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add forge https://github.com/Card-Forge/forge.git
          git fetch forge master
          git fetch origin sync/upstream || true

      - name: Check backlog
        id: behind
        run: echo "behind=$(git rev-list --count master..forge/master)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into sync branch
        if: steps.behind.outputs.behind > 0
        run: |
          git config user.name "Reforge"
          git config user.email "dev@reforge-commander.dev"
          if [ "$(git rev-parse --verify origin/sync/upstream 2>/dev/null)" ]; then
            git checkout -b sync/upstream origin/sync/upstream
          else
            git checkout -b sync/upstream master
          fi
          git merge --no-edit master
          git merge --no-edit forge/master
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Merge conflicts with upstream. Resolve manually:"
            echo "::error::  git fetch forge && git checkout -b sync/upstream origin/sync/upstream && git merge forge/master"
            exit 1
          fi

      - name: Push sync branch
        if: steps.behind.outputs.behind > 0
        id: push
        run: |
          git push origin sync/upstream
          echo "head=$(git rev-parse sync/upstream)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.behind.outputs.behind > 0
        id: pr
        run: |
          pr=$(gh pr list --base master --head sync/upstream --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base master --head sync/upstream \
              --title "chore: sync with upstream forge (${{ steps.behind.outputs.behind }} commits)" \
              --body "Automated sync from Card-Forge/forge master. Merges only after CI passes.")
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Wait for CI
        if: steps.behind.outputs.behind > 0
        run: |
          HEAD=${{ steps.push.outputs.head }}
          for i in $(seq 1 60); do
            # The branch was just pushed: check-runs may not be registered yet,
            # so wait until at least one exists AND none are pending.
            # Poll the exact pushed SHA (not gh pr view) to avoid reading a
            # stale headRefOid while the new commit's checks are still queued.
            DATA=$(gh api "repos/${{ github.repository }}/commits/$HEAD/check-runs" 2>/dev/null || echo '{"total_count":0,"check_runs":[]}')
            TOTAL=$(echo "$DATA" | jq '.total_count')
            PEND=$(echo "$DATA" | jq '[.check_runs[] | select(.status == "in_progress" or .status == "queued")] | length')
            echo "check-runs: ${TOTAL}, pending: ${PEND} (${i}/60)"
            if [ "$TOTAL" -gt 0 ] && [ "$PEND" -eq 0 ]; then
              FAIL=$(echo "$DATA" | jq '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required")] | length')
              if [ "$FAIL" -gt 0 ]; then
                echo "::error::CI checks failed on $HEAD"
                echo "$DATA" | jq -r '.check_runs[] | "\(.name): \(.conclusion)"'
                exit 1
              fi
              exit 0
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for CI checks on $HEAD"
          exit 1

      - name: Merge pull request
        if: steps.behind.outputs.behind > 0
        run: |
          PR=${{ steps.pr.outputs.number }}
          # ponytail: auto-merge needs the repo-level "Allow auto-merge" setting;
          # fall back to a direct merge (safe after Wait for CI) when absent.
          gh pr merge "$PR" --merge --auto || gh pr merge "$PR" --merge
