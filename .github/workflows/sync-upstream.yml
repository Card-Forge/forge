name: Sync upstream forge

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add forge https://github.com/Card-Forge/forge.git
          git fetch forge master
          git fetch origin sync/upstream || true

      - name: Check backlog
        id: behind
        run: echo "behind=$(git rev-list --count master..forge/master)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into sync branch
        if: steps.behind.outputs.behind > 0
        run: |
          git config user.name "Reforge"
          git config user.email "dev@reforge-commander.dev"
          if [ "$(git rev-parse --verify origin/sync/upstream 2>/dev/null)" ]; then
            git checkout -b sync/upstream origin/sync/upstream
          else
            git checkout -b sync/upstream master
          fi
          git merge --no-edit master
          git merge --no-edit forge/master
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Merge conflicts with upstream. Resolve manually:"
            echo "::error::  git fetch forge && git checkout -b sync/upstream origin/sync/upstream && git merge forge/master"
            exit 1
          fi

      - name: Push sync branch
        if: steps.behind.outputs.behind > 0
        run: git push origin sync/upstream

      - name: Open pull request
        if: steps.behind.outputs.behind > 0
        id: pr
        run: |
          pr=$(gh pr list --base master --head sync/upstream --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base master --head sync/upstream \
              --title "chore: sync with upstream forge (${{ steps.behind.outputs.behind }} commits)" \
              --body "Automated sync from Card-Forge/forge master. Merges only after CI passes." \
              --reviewer @copilot)
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Wait for CI
        if: steps.behind.outputs.behind > 0
        run: |
          PR=${{ steps.pr.outputs.number }}
          HEAD=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          for i in $(seq 1 30); do
            N=$(gh api "repos/${{ github.repository }}/commits/$HEAD/check-runs" --jq '.total_count' 2>/dev/null || echo 0)
            [ "$N" -gt 0 ] && break
            echo "waiting for CI checks to register... (${i}/30)"
            sleep 20
          done
          gh pr checks "$PR" --watch --interval 20

      - name: Wait for Copilot review
        if: steps.behind.outputs.behind > 0
        run: |
          PR=${{ steps.pr.outputs.number }}
          for i in $(seq 1 60); do
            DEC=$(gh pr view "$PR" --json reviewDecision --jq .reviewDecision 2>/dev/null || echo "")
            echo "copilot review decision: ${DEC:-none} (${i}/60)"
            [ "$DEC" = "APPROVED" ] && exit 0
            [ "$DEC" = "CHANGES_REQUESTED" ] && { echo "::error::Copilot requested changes on sync PR $PR"; exit 1; }
            sleep 20
          done
          echo "::error::Timed out waiting for Copilot review on sync PR $PR"
          exit 1

      - name: Merge
        if: steps.behind.outputs.behind > 0
        run: gh pr merge ${{ steps.pr.outputs.number }} --merge
