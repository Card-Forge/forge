name: Test build

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    name: Test with Java ${{ matrix.Java }}
    steps:
      - uses: actions/checkout@v3

      # ponytail: docs/tools/workflow-only changes cannot break the Java suite;
      # skip the (tens of minutes) Maven run but still report success so the
      # ruleset's required "Test with Java 17/21" checks stay satisfied.
      - name: Detect code changes
        id: code
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!tools/**'
              - '!.github/**'
              - '!**/*.md'

      - name: Setup java
        if: steps.code.outputs.code == 'true'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Install virtual framebuffer (if not available) to allow running GUI on a headless server
        if: steps.code.outputs.code == 'true'
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Run tests in virtual framebuffer
        if: steps.code.outputs.code == 'true'
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B clean test

  docs:
    runs-on: ubuntu-latest
    name: doc-status
    steps:
      - uses: actions/checkout@v3
      - name: Verify roadmap statuses match code markers
        run: bash tools/doc-status.sh
      - name: Verify desktop ↔ mobile platform parity
        run: bash tools/platform-parity.sh
