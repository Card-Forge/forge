name: Test build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    name: Test with Java ${{ matrix.Java }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Choose test scope
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          yq --version
          scopes=.github/test-scopes.yml
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)

          # Treat a changed card script as a change to each test file and each file in res/lists that names the card.
          # Names come from the Name: lines of the old and new script, so renamed and deleted cards still match.
          names=$(grep '^forge-gui/res/cardsfolder/' <<< "$changed" | while read -r script; do
            { git show "HEAD^1:$script" 2>/dev/null; git show "HEAD:$script" 2>/dev/null; } | sed -n 's/^Name://p'
          done | tr -d '\r' | grep -v '^$' | sort -u || true)
          if [ -n "$names" ]; then
            changed+=$'\n'$(grep -rlF -f <(echo "$names") forge-gui-desktop/src/test forge-gui/res/lists || true)
          fi

          matches() {
            while read -r pattern; do
              while read -r file; do
                [[ $file == $pattern ]] && return 0
              done <<< "$changed"
            done < <(yq ".\"$1\"[]" "$scopes")
            return 1
          }

          if matches all; then
            echo "run: all"
            exit 0
          fi

          excludes="$RUNNER_TEMP/excludes.txt"
          : > "$excludes"
          for category in $(yq 'keys | .[] | select(. != "all")' "$scopes"); do
            if matches "$category"; then
              echo "run:  $category"
            else
              echo "skip: $category"
              echo "forge/$category/**" >> "$excludes"
            fi
          done
          echo "args=-Dsurefire.excludesFile=$excludes" >> "$GITHUB_OUTPUT"

      - name: Install virtual framebuffer (if not available) to allow running GUI on a headless server
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Run tests in virtual framebuffer
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B clean test ${{ steps.scope.outputs.args }}
