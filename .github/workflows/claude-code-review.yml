name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Crucible-owned paths only. Without this filter, an upstream sync merge
    # from Card-Forge/forge sends a 500-file Java diff to review. See
    # docs/crucible/adr/0001-fork-layout-and-upstream-sync.md.
    paths:
      - "crucible/**"
      - "docs/crucible/**"
      - "CLAUDE.md"
      - ".github/workflows/claude*.yml"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the prompt below runs /code-review --comment, and the
      # action's only allowed tool is create_inline_comment. With `read` the
      # review runs to completion and every comment attempt is denied — runs go
      # green, permission_denials_count climbs, and nothing is ever posted.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # --allowedTools replaces the default allowlist, it does not add to
          # it. Listing only the comment tool left the review unable to read the
          # diff it was reviewing: every run finished green with
          # permission_denials_count between 1 and 11 and posted nothing, on
          # every PR since this workflow was added.
          #
          # /code-review needs to read the change before it can comment on it —
          # git for the diff, Read/Grep/Glob for the files around it, Task for
          # the verify pass — and then the MCP tool to post.
          #
          # gh, not just git: the prompt names a pull request, so the review
          # fetches it with `gh pr diff` before it can read anything. Without
          # this the run stops after four turns with five denials and the
          # action reports is_error, which is how this list was found.
          #
          # show_full_output prints what the SDK did, including the name of each
          # denied tool. --debug alone does not: the action hides SDK output
          # unless this input says otherwise. Both stay until a run shows zero
          # denials, then the list gets trimmed to what the review actually uses.
          show_full_output: true
          claude_args: >-
            --debug
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git:*),Bash(gh:*),TodoWrite,Task"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

