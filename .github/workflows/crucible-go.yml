# Crucible's Go build.
#
# Triggered by Crucible's own code and by the upstream files Crucible reads --
# and by nothing else, so unrelated upstream churn (forge-gui, the mobile
# shells, upstream docs) never runs this job.
#
# The upstream paths are not optional. ADR-0001 requires the corpus checks to
# run after every upstream sync, and says new card scripts are "immediately
# visible to the corpus golden test". Both goldens under internal/ are derived
# from res/cardsfolder and res/lists, and tools/javacycles measures ADR-0003's
# 82-cycle premise from forge-game. A trigger that skipped them would make a
# sync that breaks any of those three silent until the next Crucible push.
name: Crucible Go

# The two lists are duplicated on purpose: GitHub's workflow parser rejects
# YAML anchors, so there is no way to write them once.
on:
  push:
    branches: [master]
    paths:
      - 'crucible/**'
      - '.github/workflows/crucible-go.yml'
      - 'forge-gui/res/cardsfolder/**'
      - 'forge-gui/res/lists/TypeLists.txt'
      - 'forge-game/src/main/java/**'
  pull_request:
    paths:
      - 'crucible/**'
      - '.github/workflows/crucible-go.yml'
      - 'forge-gui/res/cardsfolder/**'
      - 'forge-gui/res/lists/TypeLists.txt'
      - 'forge-game/src/main/java/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: crucible

jobs:
  build:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go-version-file reads crucible/go.mod, so the pinned toolchain in
      # ADR-0002 is the single source of truth and CI cannot drift from it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: crucible/go.mod
          cache-dependency-path: crucible/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # GO-1's linter set, plus depguard carrying the architectural boundaries
      # the ADRs state. Pinned, per ADR-0002's tools policy.
      #
      # Two version constraints, both found the hard way:
      #
      #   golangci-lint 2.6.x cannot read Go 1.27 export data, failing with
      #   "export data version 4 is greater than maximum supported version 2".
      #   2.13.2 is the first that can.
      #
      #   golangci-lint-action v6 rejects any v2 golangci-lint outright:
      #   "golangci-lint v2 is not supported by golangci-lint-action v6".
      #   v7 is the minimum; v9 is current and keeps the same inputs.
      #
      # Lower either without checking and the step fails before it lints.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: crucible

      # -race is not optional here. The engine is goroutine-per-game with an
      # immutable shared card database, and a silently shared pointer is the
      # highest-probability bug to import from Java's mutable statics
      # (GO-2, TEST-7).
      - name: go test -race
        run: go test -race -count=1 ./...

      # ADR-0003's premise, re-checked rather than trusted. If an upstream sync
      # ever changes the coupling in forge-game, the single-package engine core
      # needs revisiting, and this is how we find out instead of assuming.
      - name: ADR-0003 premise — java package cycles
        run: go run ./tools/javacycles -root ../forge-game/src/main/java -prefix forge.game -expect 82

      # DOC-12 and ADRP-4 say the documentation lands with the code. docgate is
      # what makes that a build failure instead of a review habit.
      - name: docgate — doc-before-code (DOC-12, PORT-4, ADRP-4)
        run: go run ./tools/docgate -module . -docs ../docs/crucible

      # ADR-0003 admits "discipline replaces enforcement inside that boundary".
      # enginelint is the enforcement. Skipped until internal/engine exists.
      - name: enginelint
        run: |
          if [ -f internal/engine/enginelint.json ]; then
            go run ./tools/enginelint -config internal/engine/enginelint.json
          else
            echo "internal/engine does not exist yet (lands at M4); nothing to check"
          fi

  oracle-parity:
    name: javarand vs java.util.Random
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 21, not 25: upstream's own CI matrix tests 17 and 21 only, and 21 is
      # the newer tested LTS (ADR-0002).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version-file: crucible/go.mod
          cache-dependency-path: crucible/go.sum

      # Regenerate the golden from a real JVM and require it to be byte-identical
      # to the committed one. Without this the golden is just a file Go agrees
      # with itself about, and the whole parity claim is circular.
      - name: regenerate golden from a real JVM
        run: |
          javac -d /tmp/jout oracle-java/src/main/java/crucible/oracle/RandomDumper.java
          java -cp /tmp/jout crucible.oracle.RandomDumper > /tmp/java-random.golden
          if ! diff -u pkg/javarand/testdata/java-random.golden /tmp/java-random.golden; then
            echo "::error::committed golden differs from this JVM's output"
            exit 1
          fi
          echo "golden reproduced exactly: $(wc -l < /tmp/java-random.golden) records"

      - name: parity test
        run: go test -race -count=1 -run TestJavaParity -v ./pkg/javarand/
